<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ことば穴うめパズル</title>
<style>
  :root{
    --bg:#FBF6EA;          /* 生成りの紙 */
    --panel:#FFFFFF;
    --ink:#1B1915;         /* 本文 コントラスト比 15:1 以上 */
    --sub:#5A5245;
    --line:#C8BBA0;
    --ok:#136B3A;
    --ok-bg:#E3F3E8;
    --ng:#9A3120;
    --ng-bg:#F5E4E0;
    --accent:#1A4E8A;
    --gap:clamp(6px,1.6dvh,14px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* .choices / .answer / .overlay は display を指定しているので、
     hidden 属性を確実に効かせる */
  [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    /* メイリオ(Windows)を最優先。無い端末は各OS標準のゴシックへ順に落ちる:
       iOS/Mac=ヒラギノ角ゴ、Android=Noto Sans JP、Windows新環境=游ゴシック */
    font-family:"Meiryo","メイリオ",
                "Hiragino Sans","ヒラギノ角ゴシック","Hiragino Kaku Gothic ProN",
                "Noto Sans JP","Noto Sans CJK JP",
                "Yu Gothic UI","Yu Gothic","游ゴシック体","YuGothic",
                system-ui,sans-serif;
    overflow:hidden; touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit; color:inherit; cursor:pointer}

  #app{
    height:100dvh; display:grid; grid-template-rows:auto 1fr auto;
    padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
            max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    gap:var(--gap);
  }

  /* ───── 上部バー ───── */
  .bar{display:flex; align-items:center; gap:10px; min-height:clamp(30px,8dvh,50px)}
  .dots{display:flex; gap:clamp(3px,0.7vw,7px); flex:1; min-width:0}
  .dot{flex:1; max-width:26px; height:clamp(7px,1.6dvh,12px); border-radius:99px;
       background:#E2D8C2; border:1px solid var(--line)}
  .dot.done{background:var(--ok); border-color:var(--ok)}
  .dot.miss{background:#D9C88E; border-color:#B89F55}
  .dot.now{background:var(--accent); border-color:var(--accent)}
  .count{font-size:clamp(14px,3.4dvh,22px); color:var(--sub); white-space:nowrap;
         font-variant-numeric:tabular-nums}
  .tool{
    border:2px solid var(--line); background:var(--panel); border-radius:99px;
    font-size:clamp(13px,3.2dvh,20px); padding:.25em .9em; min-height:clamp(30px,7dvh,46px);
    white-space:nowrap;
  }
  .tool:disabled{opacity:.35}
  .tool:active{background:#F0E9DA}

  /* ───── 問題 ───── */
  .stage{display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:var(--gap); min-height:0; text-align:center}
  .qlabel{margin:0; font-size:clamp(12px,3dvh,20px); letter-spacing:.3em; color:var(--sub)}
  .quiz{width:100%; white-space:nowrap; line-height:1.2; font-weight:700;
        max-height:46dvh; overflow:hidden;
        font-size:clamp(26px,min(18dvh,8.6vw),80px)}
  .quiz.yoji{letter-spacing:.06em}
  .blank{
    display:inline-block; min-width:1.15em; margin:0 .08em; padding:0 .06em;
    border-bottom:.12em solid var(--accent); color:var(--accent);
  }
  .blank.filled{color:var(--ok); border-bottom-color:var(--ok)}
  .msg{margin:0; font-size:clamp(14px,4dvh,26px); color:var(--sub); min-height:1.3em}
  .msg.okmsg{color:var(--ok); font-weight:600}
  .msg.ngmsg{color:var(--ng)}

  /* ───── 選択肢 ───── */
  .choices{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(6px,1.4vw,14px)}
  .choice{
    border:3px solid var(--line); background:var(--panel); border-radius:14px;
    min-height:clamp(54px,23dvh,108px); padding:.1em .2em;
    font-size:clamp(20px,min(10dvh,4.4vw),48px); font-weight:700; line-height:1.1;
    white-space:nowrap; box-shadow:0 3px 0 #E0D5BE;
  }
  .choice:active:not(:disabled){transform:translateY(3px); box-shadow:none}
  .choice.ng{background:var(--ng-bg); border-color:var(--ng); color:var(--ng)}
  .choice.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
  .choice.off{opacity:.25}
  .choice:disabled{cursor:default}
  .mark{font-size:.7em; margin-right:.15em}

  /* ───── 正解パネル ───── */
  .answer{display:grid; grid-template-columns:1fr auto; align-items:center;
          gap:clamp(8px,2vw,18px); background:var(--ok-bg);
          border:3px solid var(--ok); border-radius:14px; padding:clamp(6px,1.6dvh,14px)}
  .yomi{display:block; font-size:clamp(13px,min(4.2dvh,2.4vw),24px); color:var(--sub)}
  .imi{display:block; font-size:clamp(17px,min(7dvh,3.6vw),34px); line-height:1.4;
       margin-top:.1em; font-weight:600}
  .next{
    border:none; background:var(--ok); color:#fff; border-radius:12px;
    font-size:clamp(17px,5dvh,32px); font-weight:600; padding:.4em 1em;
    min-height:clamp(46px,15dvh,84px); white-space:nowrap;
  }
  .next:active{filter:brightness(.9)}

  /* ───── 結果・回転案内 ───── */
  .overlay{position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:var(--gap); text-align:center;
           padding:20px; z-index:10}
  .big{font-size:clamp(24px,10dvh,56px); font-weight:600; margin:0}
  .mid{font-size:clamp(16px,5dvh,32px); margin:0; line-height:1.4}
  .stars{font-size:clamp(20px,7dvh,42px); letter-spacing:.1em; color:#C8961E; word-break:break-all}
  .again{border:none; background:var(--accent); color:#fff; border-radius:14px;
         font-size:clamp(18px,5.5dvh,34px); font-weight:600; padding:.5em 1.6em;
         min-height:clamp(48px,14dvh,88px)}

  /* ───── 縦持ち(ポートレート) ───── */
  @media (orientation:portrait){
    .quiz{white-space:normal; max-height:42dvh; line-height:1.35;
          font-size:clamp(30px,min(12dvh,16vw),96px)}
    .qlabel{font-size:clamp(13px,min(2.6dvh,3.6vw),22px)}
    .msg{font-size:clamp(15px,min(2.8dvh,4.4vw),28px)}
    .choices{grid-template-columns:repeat(2,1fr)}
    .choice{min-height:clamp(64px,11dvh,130px);
            font-size:clamp(24px,min(6dvh,10vw),56px)}
    .answer{grid-template-columns:1fr; gap:clamp(8px,1.4dvh,16px)}
    .yomi{font-size:clamp(15px,min(2.6dvh,4.4vw),26px)}
    .imi{font-size:clamp(19px,min(3.6dvh,6.2vw),38px)}
    .next{width:100%; min-height:clamp(54px,8dvh,96px)}
    .count{font-size:clamp(14px,3.6vw,22px)}
    .tool{font-size:clamp(13px,3.4vw,20px)}
  }

  :focus-visible{outline:4px solid var(--accent); outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="count" id="count">1 / 10</div>
    <button class="tool" id="hint" type="button">ヒント</button>
    <button class="tool" id="sound" type="button" aria-pressed="true">♪ 音あり</button>
  </header>

  <main class="stage">
    <p class="qlabel" id="qlabel">四字熟語</p>
    <div class="quiz" id="quiz"></div>
    <p class="msg" id="msg" role="status" aria-live="polite">□に入ることばを えらんでください</p>
  </main>

  <section class="choices" id="choices" aria-label="選択肢"></section>

  <section class="answer" id="answer" hidden>
    <div>
      <span class="yomi" id="yomi"></span>
      <span class="imi" id="imi"></span>
    </div>
    <button class="next" id="next" type="button">つぎへ ▶</button>
  </section>
</div>

<div class="overlay" id="result" hidden>
  <p class="big" id="rTitle"></p>
  <p class="stars" id="rStars"></p>
  <p class="mid" id="rBody"></p>
  <button class="again" id="again" type="button">もう一度 あそぶ</button>
</div>

<script src="questions.js"></script>
<script>
(function(){
  "use strict";
  var PER_GAME = 10;
  var deck = [], idx = 0, star = 0, firstTry = true, soundOn = true, answered = false;

  var $ = function(id){ return document.getElementById(id); };
  var dotsEl=$("dots"), countEl=$("count"), hintBtn=$("hint"), soundBtn=$("sound"),
      qlabelEl=$("qlabel"), quizEl=$("quiz"), msgEl=$("msg"), choicesEl=$("choices"),
      answerEl=$("answer"), yomiEl=$("yomi"), imiEl=$("imi"), nextBtn=$("next"),
      resultEl=$("result");

  /* ── 音(短い和音。WebAudio が無い端末では黙って無効) ── */
  var actx = null;
  function beep(freqs, dur){
    if(!soundOn) return;
    try{
      if(!actx){ var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; actx = new AC(); }
      if(actx.state === "suspended") actx.resume();
      freqs.forEach(function(f, i){
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = f;
        var t0 = actx.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t0); o.stop(t0 + dur + 0.05);
      });
    }catch(e){ /* 音が出せなくても進行に影響させない */ }
  }

  function shuffle(a){
    a = a.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ── 枠からはみ出さないよう文字を自動で縮める
        (横向き=1行なので横幅、縦向き=折り返すので高さが効く) ── */
  function over(el){
    return el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
  }
  function fit(el, maxPx){
    el.style.fontSize = "";
    var size = maxPx || parseFloat(getComputedStyle(el).fontSize);
    el.style.fontSize = size + "px";
    var guard = 0;
    while(over(el) && size > 12 && guard++ < 60){
      size -= Math.max(1, size * 0.05);
      el.style.fontSize = size + "px";
    }
  }
  function fitAll(){
    fit(quizEl);
    Array.prototype.forEach.call(choicesEl.children, function(b){ fit(b); });
  }

  function newGame(){
    deck = shuffle(QUESTIONS).slice(0, PER_GAME);
    idx = 0; star = 0;
    dotsEl.innerHTML = "";
    for(var i = 0; i < deck.length; i++){
      var d = document.createElement("span");
      d.className = "dot"; dotsEl.appendChild(d);
    }
    resultEl.hidden = true;
    render();
  }

  function render(){
    var item = deck[idx];
    answered = false; firstTry = true;

    countEl.textContent = (idx + 1) + " / " + deck.length;
    Array.prototype.forEach.call(dotsEl.children, function(d, i){
      d.classList.toggle("now", i === idx);
    });
    qlabelEl.textContent = item.t === "y" ? "四字熟語" : "ことわざ";

    var parts = item.q.split("_");
    quizEl.className = "quiz" + (item.t === "y" ? " yoji" : "");
    quizEl.innerHTML = "";
    quizEl.appendChild(document.createTextNode(parts[0]));
    var blank = document.createElement("span");
    blank.className = "blank"; blank.id = "blank"; blank.textContent = "？";
    quizEl.appendChild(blank);
    quizEl.appendChild(document.createTextNode(parts[1] || ""));

    msgEl.textContent = "□に入る ことばを えらんでください";
    msgEl.className = "msg";

    choicesEl.innerHTML = "";
    shuffle(item.c).forEach(function(v){
      var b = document.createElement("button");
      b.type = "button"; b.className = "choice"; b.textContent = v;
      b.addEventListener("click", function(){ pick(b, v); });
      choicesEl.appendChild(b);
    });

    choicesEl.hidden = false;
    answerEl.hidden = true;
    hintBtn.disabled = false;
    fitAll();
  }

  function pick(btn, val){
    if(answered || btn.disabled) return;
    var item = deck[idx];

    if(val === item.a){
      answered = true;
      beep([660, 880], 0.18);
      var blank = document.getElementById("blank");
      blank.textContent = item.a;
      blank.classList.add("filled");
      fit(quizEl);
      btn.classList.add("ok");
      btn.innerHTML = '<span class="mark">○</span>' + item.a;
      Array.prototype.forEach.call(choicesEl.children, function(b){ b.disabled = true; });
      hintBtn.disabled = true;

      dotsEl.children[idx].classList.add(firstTry ? "done" : "miss");
      if(firstTry) star++;

      msgEl.textContent = firstTry ? "せいかい！" : "せいかい！ よくできました";
      msgEl.className = "msg okmsg";
      yomiEl.textContent = item.yomi;
      imiEl.textContent = item.imi;
      choicesEl.hidden = true;
      answerEl.hidden = false;
      nextBtn.focus({ preventScroll:true });
    }else{
      firstTry = false;
      beep([220], 0.16);
      btn.classList.add("ng");
      btn.innerHTML = '<span class="mark">✕</span>' + val;
      btn.disabled = true;
      msgEl.textContent = "おしい！ もう一度 えらんでください";
      msgEl.className = "msg ngmsg";
      fit(btn);
    }
  }

  hintBtn.addEventListener("click", function(){
    if(answered) return;
    var item = deck[idx], removed = 0;
    Array.prototype.forEach.call(choicesEl.children, function(b){
      if(removed < 2 && !b.disabled && b.textContent !== item.a){
        b.disabled = true; b.classList.add("off"); removed++;
      }
    });
    firstTry = false;
    hintBtn.disabled = true;
    msgEl.textContent = "のこり2つに しぼりました";
    msgEl.className = "msg";
  });

  nextBtn.addEventListener("click", function(){
    idx++;
    if(idx >= deck.length) showResult(); else render();
  });

  function showResult(){
    var t, body;
    if(star === deck.length){ t = "ぜんぶ せいかい！"; body = "おみごとです。"; }
    else if(star >= deck.length - 2){ t = "おみごと！"; body = "あと少しで ぜんぶ せいかいです。"; }
    else if(star >= deck.length / 2){ t = "よくできました"; body = "ことばの意味も おぼえられましたね。"; }
    else { t = "おつかれさまでした"; body = "何度でも あそべます。ゆっくりどうぞ。"; }
    $("rTitle").textContent = t;
    $("rStars").textContent = new Array(star + 1).join("★") + new Array(deck.length - star + 1).join("☆");
    $("rBody").textContent = "一度で せいかい " + star + " 問 / " + deck.length + " 問\n" + body;
    $("rBody").style.whiteSpace = "pre-line";
    resultEl.hidden = false;
    $("again").focus({ preventScroll:true });
    beep([523, 659, 784], 0.22);
  }
  $("again").addEventListener("click", newGame);

  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "♪ 音あり" : "♪ 音なし";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    if(soundOn) beep([660], 0.12);
  });

  /* ── キーボード(PC確認用): 1〜4で選択、Enter/スペースで次へ ── */
  document.addEventListener("keydown", function(e){
    if(!resultEl.hidden){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); newGame(); }
      return;
    }
    if(e.key >= "1" && e.key <= "4" && !answered){
      var b = choicesEl.children[Number(e.key) - 1];
      if(b && !b.disabled){ b.click(); }
    }else if((e.key === "Enter" || e.key === " ") && answered){
      e.preventDefault(); nextBtn.click();
    }
  });

  window.addEventListener("resize", fitAll);
  window.addEventListener("orientationchange", function(){
    setTimeout(fitAll, 250);
  });

  newGame();
})();
</script>
</body>
</html>
