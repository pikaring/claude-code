<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="canonical" href="https://pikaring.github.io/when-do-gorillas-matter/app/">
<title>商人・預言者・ゴリラ・王</title>
<link rel="icon" href="../assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#16151B; --bg2:#111015; --panel:#1F1D26; --panel2:#2A2733;
    --line:#3A3645; --line2:#4E495B;
    --fg:#E7E2D6; --muted:#9A95A4;
    --bone:#ECE5D4; --ink:#16120D;
    --s0:#B8912A; --s1:#3F72A6; --s2:#7A55A8; --s3:#5F7448;
    --accent:#B99BE3; --gor:#6B6F74; --alarm:#D9534F; --ok:#6FA96B;
    --disp:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",serif;
    --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:dark;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0; background:linear-gradient(rgba(22,21,27,.72),rgba(22,21,27,.72)), url(../assets/pattern.jpg) 0 0 / 420px auto repeat, var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    background-image:radial-gradient(120% 70% at 50% -10%, #2a2436 0%, rgba(22,21,27,0) 60%)}
  .wrap{max-width:1000px; margin:0 auto; padding-inline:16px; padding-block:10px 16px;
    display:flex; flex-direction:column; gap:8px}

  /* ── 細い操作帯 ── */
  .bar{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .bar .spacer{flex:1 1 auto}
  .chip{font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--muted);
    background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:3px 8px;
    display:flex; gap:5px; align-items:center}
  .chip b{color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums}
  select,.btn{font-family:var(--body); font-size:12px; color:var(--fg); background:var(--panel2);
    border:1px solid var(--line2); border-radius:3px; padding:4px 9px; cursor:pointer}
  select{padding:3px 4px; background:transparent; border:none; color:var(--accent); font-weight:500}
  .btn:hover{background:var(--line)}
  .btn:focus-visible, select:focus-visible, .card:focus-visible, .bigbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .home{color:var(--muted); font-size:12px; text-decoration:none; border-bottom:1px solid var(--line2); padding-bottom:1px}
  .home:hover{color:var(--accent); border-color:var(--accent)}

  /* ── 役割表（得点表を兼ねる） ── */
  .sched{width:100%; border-collapse:separate; border-spacing:0 3px; font-size:12px}
  .sched th{font-family:var(--mono); font-size:10px; font-weight:400; color:var(--muted); letter-spacing:.08em; padding:0 2px 1px}
  .sched th.now{color:var(--accent); font-weight:600}
  .sched td{background:var(--panel); padding:3px 4px; text-align:center; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .sched td:first-child{text-align:left; border-left:1px solid var(--line); border-radius:3px 0 0 3px; white-space:nowrap}
  .sched td:last-child{border-right:1px solid var(--line); border-radius:0 3px 3px 0}
  .sched tr.mine td{background:#262232}
  .sched .nm{font-family:var(--disp); letter-spacing:.06em; color:var(--bone)}
  .sched .tag{font-size:9.5px; color:var(--muted); margin-left:4px}
  .sched .pts{font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums; min-width:34px}
  .sched .hc{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
  .sched td.cur{box-shadow:inset 0 0 0 1px var(--accent); background:#2F2940}
  .sched td.past{opacity:.35}
  .role{display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:19px; border-radius:3px;
    font-size:11px; font-weight:700; color:#fff; padding:0 3px; line-height:1}
  .role.r0{background:var(--s0)} .role.r1{background:var(--s1)} .role.r2{background:var(--s2)}
  .role.r3{background:var(--s3)} .role svg{width:15px;height:15px;fill:#E9E2D2}
  .role.big{height:22px; font-size:12px; padding:0 6px; gap:4px}

  /* ── 場：このトリックの札 ── */
  .table{background:linear-gradient(rgba(17,16,21,.8),rgba(17,16,21,.8)), url(../assets/hero.jpg) right 30% / cover no-repeat, var(--bg2);
    border:1px solid var(--line); border-radius:4px; padding:9px 10px;
    display:flex; flex-direction:column; gap:7px}
  .por{width:40px; height:40px; border-radius:50%; object-fit:cover; flex:none; border:1.5px solid var(--line2); background:#1C1920}
  .por.r0{border-color:var(--s0)} .por.r1{border-color:var(--s1)} .por.r2{border-color:var(--s2)} .por.r3{border-color:var(--s3)}
  .sheet .banner{display:block; width:calc(100% + 44px); margin:-22px -22px 14px; height:auto; aspect-ratio:1600/893; object-fit:cover; object-position:right center;
    border-radius:5px 5px 0 0; max-height:220px}
  .trick{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
  .slot{display:flex; flex-direction:column; align-items:center; gap:3px; width:70px}
  .slot .lbl{font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70px;
    display:flex; gap:3px; align-items:center}
  .slot .lbl b{color:var(--fg); font-weight:500}
  .slot .marks{height:15px; font-size:10px; display:flex; gap:2px; align-items:center; font-family:var(--body)}
  .mk{border-radius:2px; padding:0 3px; line-height:14px; white-space:nowrap; font-size:9.5px}
  .mk.pred{background:var(--s1); color:#fff}
  .mk.lead{border:1px solid var(--line2); color:var(--muted)}
  .mk.turn{background:var(--accent); color:var(--ink)}
  .empty{width:52px;height:74px;border-radius:4px;border:1px dashed var(--line2)}
  .status{font-size:12.5px; color:var(--fg); text-align:center; min-height:19px}
  .status em{font-style:normal; color:var(--accent); font-weight:500}
  .status .warn{color:var(--alarm)}

  /* ── 札 ── */
  .card{position:relative; width:52px; height:74px; flex:none; border-radius:4px; border:none;
    background:var(--bone); color:var(--ink); padding:0; cursor:default; font-family:var(--body);
    display:flex; flex-direction:column; overflow:hidden; text-align:left;
    box-shadow:0 2px 0 rgba(0,0,0,.45), 0 5px 12px rgba(0,0,0,.3)}
  .card .band{height:6px; flex:none}
  .card .num{font-family:var(--disp); font-size:25px; line-height:1; padding:5px 0 0 6px; letter-spacing:-.03em}
  .card .suit{position:absolute; right:4px; bottom:5px; width:22px; height:22px}
  .card .sn{position:absolute; left:6px; bottom:5px; font-size:8.5px; font-weight:700; letter-spacing:.04em}
  .card.c0 .band{background:var(--s0)} .card.c0 .num,.card.c0 .sn{color:#7A5E12} .card.c0 .suit{fill:var(--s0)}
  .card.c1 .band{background:var(--s1)} .card.c1 .num,.card.c1 .sn{color:#264F7A} .card.c1 .suit{fill:var(--s1)}
  .card.c2 .band{background:var(--s2)} .card.c2 .num,.card.c2 .sn{color:#553982} .card.c2 .suit{fill:var(--s2)}
  .card.c3 .band{background:var(--s3)} .card.c3 .num,.card.c3 .sn{color:#3E4E2C} .card.c3 .suit{fill:var(--s3)}
  .card.pick{cursor:pointer; transition:transform .12s ease, box-shadow .12s ease}
  .card.pick:hover,.card.pick:focus-visible{transform:translateY(-7px); box-shadow:0 8px 0 rgba(0,0,0,.4),0 14px 24px rgba(0,0,0,.45)}
  .card.idle{filter:brightness(.55) saturate(.6)}
  .card.fresh{box-shadow:0 0 0 2px var(--accent), 0 5px 12px rgba(0,0,0,.4)}
  .card.win{box-shadow:0 0 0 3px var(--ok), 0 5px 12px rgba(0,0,0,.4)}
  .card.gone{opacity:.35}
  .card .badge{position:absolute; top:8px; right:3px; font-size:8.5px; font-weight:700; background:var(--ok); color:#0E1410;
    border-radius:2px; padding:0 3px}
  .card .to{position:absolute; left:0; right:0; bottom:0; font-size:8.5px; text-align:center; font-weight:700;
    background:rgba(22,18,13,.82); color:var(--bone); padding:1px 0}
  .card.sel{transform:translateY(-12px); box-shadow:0 0 0 2px var(--accent), 0 10px 18px rgba(0,0,0,.45)}
  .card.pick.sel:hover{transform:translateY(-14px)}
  .stack{display:flex; height:74px; align-items:flex-start}
  .stack .card.sm + .card.sm{margin-left:-16px}
  .stack .card.sm:nth-child(2){margin-top:8px} .stack .card.sm:nth-child(3){margin-top:16px}
  .bigbtn[disabled]{opacity:.45; cursor:default; filter:none}
  .card.cb{background:#EEE6CF url(../assets/card-banana.jpg) center 60% / cover no-repeat}
  .card.cb .art, .card.csb .art, .card.cb .sn, .card.csb .sn{display:none}
  .card.cb .band{background:#D9A915} .card.cb .art{fill:#C9960E} .card.cb .sn{color:#7A5A06}
  .card.csb{background:#EFE7D0 url(../assets/card-silverback.jpg) center 60% / cover no-repeat; color:#ECE5D4}
  .card.csb .band{background:linear-gradient(90deg,#9EA3AA,#E3E6EA,#9EA3AA)} .card.csb .art{fill:#D9DCE0} .card.csb .sn{color:#E3E6EA}
  .slot .passed{font-size:11px; color:var(--muted); border:1px dashed var(--line2); border-radius:4px; width:52px; height:74px; display:grid; place-items:center}
  .pileinfo{font-size:11.5px; color:var(--muted); text-align:center; font-family:var(--mono)}
  .pileinfo b{color:var(--fg)}
  .card .art{position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:32px; height:32px}
  .card.sm .art{width:20px; height:20px}
  .card.sm{width:34px;height:48px}
  .card.sm .num{font-size:16px; padding:3px 0 0 4px}
  .card.sm .band{height:4px}
  .card.sm .suit{width:13px;height:13px;right:2px;bottom:3px}
  .card.sm .sn{display:none}

  /* ── 自分 ── */
  .me{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted)}
  .me .who{font-family:var(--disp); font-size:15px; letter-spacing:.08em; color:var(--bone)}
  .me .say{color:var(--fg)}
  .hand{display:flex; gap:5px; flex-wrap:wrap; min-height:74px; align-items:flex-end}
  .ctl{display:flex; gap:7px; flex-wrap:wrap; align-items:center; min-height:30px}
  .ctl:empty{display:none}
  .bigbtn{font-family:var(--body); font-size:13px; font-weight:700; letter-spacing:.04em;
    background:var(--accent); color:var(--ink); border:none; border-radius:3px; padding:7px 14px; cursor:pointer;
    display:inline-flex; gap:6px; align-items:center}
  .bigbtn:hover{filter:brightness(1.08)}
  .bigbtn.ghost{background:transparent; color:var(--fg); border:1px solid var(--line2); font-weight:500}
  .bigbtn.ghost:hover{background:var(--panel2); filter:none}
  .hintline{font-size:11.5px; color:var(--muted); line-height:1.5}
  .hintline em{color:var(--accent); font-style:normal; font-weight:500}

  .log{border-top:1px solid var(--line); padding-top:6px;
    font-family:var(--mono); font-size:11px; line-height:1.7; color:var(--muted);
    max-height:78px; overflow-y:auto}
  .log div{display:flex; gap:8px}
  .log .t{color:var(--line2); flex:none}
  .log .hot{color:var(--accent)} .log .bad{color:var(--alarm)} .log .you{color:#CFE3D2}

  /* ── モーダル ── */
  .modal{position:fixed; inset:0; z-index:60; background:rgba(12,11,15,.9); display:grid; place-items:center; padding:20px; overflow-y:auto}
  .sheet{background:var(--panel); border:1px solid var(--line2); border-radius:5px; max-width:600px; width:100%;
    padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .sheet h2{font-family:var(--disp); font-size:21px; margin:0 0 4px; color:var(--bone); letter-spacing:.06em}
  .sheet h3{font-family:var(--disp); font-size:15px; margin:18px 0 6px; color:var(--accent); letter-spacing:.08em}
  .sheet p,.sheet li{font-size:13.5px; margin:6px 0; line-height:1.65}
  .sheet ul{padding-left:1.2em; margin:6px 0}
  .sheet .sub{color:var(--muted); font-size:12.5px; margin-top:0}
  .sheet table{border-collapse:collapse; width:100%; font-size:12.5px; margin:8px 0}
  .sheet td,.sheet th{border-bottom:1px solid var(--line); padding:5px 6px; text-align:left}
  .sheet th{color:var(--muted); font-weight:400; font-size:11.5px}
  .sheet td.n{font-family:var(--mono); text-align:right; font-variant-numeric:tabular-nums}
  .result{font-family:var(--disp); font-size:29px; letter-spacing:.08em; margin:6px 0 2px}
  .result.win{color:var(--ok)} .result.lose{color:var(--alarm)} .result.draw{color:var(--muted)}
  .sheetfoot{display:flex; gap:9px; margin-top:18px; flex-wrap:wrap}

  @media (max-width:560px){
    .wrap{gap:7px}
    .card{width:40px;height:58px}
    .card .num{font-size:19px;padding:4px 0 0 4px}
    .card .suit{width:15px;height:15px;right:2px;bottom:3px}
    .card .sn{display:none}
    .card .art{width:26px; height:26px}
    .card .band{height:5px}
    .card .badge{top:6px; font-size:7.5px}
    .hand{gap:3px; min-height:58px}
    .slot{width:58px}
    .slot .lbl{max-width:58px}
    .empty{width:40px;height:58px}
    .slot .passed{width:40px;height:58px}
    .stack{height:58px}
    .card.sm{width:28px;height:40px}
    .card.sm .num{font-size:14px; padding:2px 0 0 3px}
    .stack .card.sm + .card.sm{margin-left:-12px}
    .stack .card.sm:nth-child(2){margin-top:6px} .stack .card.sm:nth-child(3){margin-top:12px}
    .trick{gap:4px}
    .sched{font-size:11px}
    .sched .tag{display:none}
    .role{min-width:19px; height:17px; font-size:10px}
    .log{max-height:50px}
    .hintline{font-size:11px; line-height:1.4}
    .bigbtn{padding:6px 10px; font-size:12.5px}
    .table{padding:7px 6px}
    .me .say{font-size:11.5px}
    .por{width:30px; height:30px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ape" viewBox="0 0 100 100">
    <circle cx="16" cy="45" r="11.5"/><circle cx="84" cy="45" r="11.5"/>
    <ellipse cx="50" cy="48" rx="31" ry="35"/>
    <rect x="25" y="37" width="50" height="7" rx="3.5" fill="#17130E" opacity=".5"/>
    <circle cx="38.5" cy="33.5" r="3.6" fill="#17130E"/><circle cx="61.5" cy="33.5" r="3.6" fill="#17130E"/>
    <ellipse cx="50" cy="65" rx="19.5" ry="15" fill="#17130E" opacity=".28"/>
    <ellipse cx="43.5" cy="62" rx="3.2" ry="2.4" fill="#17130E"/><ellipse cx="56.5" cy="62" rx="3.2" ry="2.4" fill="#17130E"/>
    <path d="M40 72 Q50 78.5 60 72" fill="none" stroke="#17130E" stroke-width="2.6" stroke-linecap="round"/>
  </symbol>
  <!-- 貨幣：穴あき銭 -->
  <symbol id="su0" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 1 1 0 20a10 10 0 1 1 0-20zm-3 7h6v6h-6z"/></symbol>
  <!-- 聖典：巻物 -->
  <symbol id="su1" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v11a2 2 0 0 0 2 2H8a3 3 0 0 1-3-3zM3 6a2 2 0 0 1 4 0v2H3z M8 8h8v1.6H8z M8 11.5h8v1.6H8z M8 15h5v1.6H8z" fill-rule="evenodd"/></symbol>
  <!-- 旗 -->
  <symbol id="su2" viewBox="0 0 24 24"><path d="M2 7l5 5l5-8l5 8l5-5l-2 12H4z M4 20h16v2H4z"/></symbol>
  <!-- 冠 -->
  <symbol id="su3" viewBox="0 0 100 100"><circle cx="16" cy="45" r="11.5"/><circle cx="84" cy="45" r="11.5"/><ellipse cx="50" cy="48" rx="31" ry="35"/></symbol>
  <!-- バナナ -->
  <symbol id="banana" viewBox="0 0 24 24"><path d="M19 3c1 0 1.5.8 1 1.6c1.6 7.4-3.4 15.6-12.6 16.3c-2 .2-4.4-.7-4.4-1.9c0-.9 1-1.2 2.2-1.2c7.3.2 12.8-6.4 12.5-13.2c-.1-.9.4-1.6 1.3-1.6z"/></symbol>
</svg>

<div class="wrap">
  <div class="bar">
    <span class="chip">第<b id="roundNum">1</b>/4局 場<b id="trickNum">1</b>/<b id="trickMax">4</b> 山札<b id="pileCount">0</b></span>
    <span class="chip"><select id="nSel" aria-label="人数">
      <option value="2">2人</option><option value="3">3人</option><option value="4" selected>4人</option>
    </select><select id="diffSel" aria-label="CPUのむずかしさ">
      <option value="easy">やさしい</option><option value="normal" selected>ふつう</option><option value="hard">むずかしい</option>
    </select></span>
    <span class="spacer"></span>
    <a class="home" href="../index.html">紹介ページ</a>
    <button class="btn" id="rulesBtn">あそびかた</button>
    <button class="btn" id="resetBtn">最初から</button>
  </div>

  <table class="sched" id="sched" aria-label="役割の予定と得点"></table>

  <div class="table">
    <div class="trick" id="trick"></div>
    <div class="pileinfo" id="pileinfo"></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>

  <div class="me" id="meRow"></div>
  <div class="hand" id="hand"></div>
  <div class="ctl" id="actions"></div>
  <div class="hintline" id="hint"></div>
  <div class="log" id="log" aria-live="polite"></div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(function(){
"use strict";

/* ══ 定数 ══════════════════════════════════════════════ */
var ROLES = [
  {name:"商人",   short:"商", ab:"仲買"},
  {name:"預言者", short:"預", ab:"預言"},
  {name:"王",     short:"王", ab:"先導"},
  {name:"ゴリラ", short:"ゴ", ab:"野生"}
];
var MER = 0, PRO = 1, KIN = 2, GOR = 3, NR = 4;
var SUITS = ["貨幣","聖典","冠","ゴリラ"];
var BAN = -1, SBK = -2;                 // バナナ・シルバーバックのスート番号（スートなし）
var RANGE = {2:9, 3:11, 4:13};          // 人数ごとの数字の範囲（各スート、同じ数字が2枚ずつ）
var COPIES = 2, BANANAS = 4, SB_PTS = 0;   // シルバーバックは得点札にならず、使うと山札に戻る
var HAND_MAX = 8, TRICKS = 4, ROUNDS = 4, MAX_COMBO = 3;
var PLAY_ORDER = [KIN, MER, PRO, GOR];  // 出す順：王→商人→預言者→ゴリラ（王の席から反時計回り）
var ROLE_AT = [PRO, MER, KIN, GOR];     // 円卓の並び。各プレイヤーの役割は 王→商人→預言者→ゴリラ→王 と移る
var ROLE_IMG = ['../assets/role-merchant.jpg', '../assets/role-prophet.jpg', '../assets/role-king.jpg', '../assets/role-gorilla.jpg'];
var FORM_NAME = {single:"1枚", run:"連番", set:"同数", sb:"シルバーバック"};
/* 対戦相手は all-in-texas の PERSONAS と同じ5人 */
var PERSONAS = [
  { name:'ビエホ',     tag:'堅実',     tight:0.9,  aggr:0.35, bluff:0.05 },
  { name:'ディアブロ', tag:'攻撃',     tight:0.5,  aggr:0.9,  bluff:0.3  },
  { name:'ゴルド',     tag:'ゆるい',   tight:0.15, aggr:0.3,  bluff:0.1  },
  { name:'ヴィニー',   tag:'標準',     tight:0.6,  aggr:0.55, bluff:0.15 },
  { name:'ロコ',       tag:'気まぐれ', tight:0.4,  aggr:0.6,  bluff:0.25 }
];
var DIFF = {
  easy:   {noise:4.0, hint:true,  careful:false, delay:650},
  normal: {noise:2.0, hint:false, careful:false, delay:600},
  hard:   {noise:0.7, hint:false, careful:true,  delay:600}
};

var G = null;
function $(id){ return document.getElementById(id); }
function rnd(){ return Math.random(); }
function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* プレイヤー p の場 t（第k局）での役割。役割は場が終わるごとに時計回りに隣へ移る
   （預言者の次の場はゴリラなので、預言で奪ったシルバーバックをすぐ使える） */
function roleOf(p, t, k){ return ROLE_AT[((p - t + k + (G ? G.off : 0)) % NR + NR) % NR]; }   // G.off：ゲームごとにランダムな円卓の向き
function roleNow(p){ return roleOf(p, G.trick, G.round); }
function holder(role){ for (var p=0;p<G.N;p++) if (roleNow(p) === role) return p; return -1; }
function nm(p){ return p === 0 ? "あなた" : G.names[p]; }
function isNum(c){ return c.s >= 0; }
function isBan(c){ return c.s === BAN; }
function isSB(c){ return c.s === SBK; }
function sortHand(h){ h.sort(function(a,b){ var ka = a.s < 0 ? 10 - a.s : a.s, kb = b.s < 0 ? 10 - b.s : b.s; return ka - kb || a.r - b.r || a.id - b.id; }); }
function ptsOf(c){ return isSB(c) ? SB_PTS : isBan(c) ? 0 : c.r; }
function sumPts(cs){ var v=0; cs.forEach(function(c){ v += ptsOf(c); }); return v; }
function scoreOf(p){ return sumPts(G.piles[p]); }
function removeCard(arr, id){ for (var i=0;i<arr.length;i++) if (arr[i].id===id) return arr.splice(i,1)[0]; return null; }
function cardName(c){ return isBan(c) ? "バナナ" : isSB(c) ? "シルバーバック" : SUITS[c.s] + c.r; }
function cardsName(cs){ return cs.map(cardName).join("・"); }
function maxBy(a, f){ return a.reduce(function(x,y){ return f(x) >= f(y) ? x : y; }); }
function flat(played){ var o=[]; played.forEach(function(x){ o = o.concat(x.cards); }); return o; }

/* ══ 組 ════════════════════════════════════════════ */
/* 1枚／連番（同じスートの続き数字2〜3枚）／同数（同じ数字2〜3枚、スート不問）／シルバーバック（1枚）。
   バナナは同数の足りない1枚の代わり（同じ数字のコピー、1組1枚まで）。連番には使えない */
function formOf(cs, hint){
  var n = cs.length;
  if (!n || n > MAX_COMBO) return null;
  var sbs = cs.filter(isSB), bans = cs.filter(isBan), real = cs.filter(isNum);
  if (sbs.length) return n === 1 ? {t:"sb", s:-1, n:1, top:99} : null;
  if (bans.length > 1 || !real.length) return null;
  if (n === 1) return {t:"single", s:real[0].s, n:1, top:real[0].r};
  var rs = real.map(function(c){ return c.r; }).sort(function(a,b){ return a-b; });
  var sameR = rs.every(function(r){ return r === rs[0]; });
  var sameS = real.every(function(c){ return c.s === real[0].s; });
  var distinct = rs.every(function(r,i){ return i === 0 || r !== rs[i-1]; });
  var span = rs[rs.length-1] - rs[0];
  if (sameR) return {t:"set", s:-1, n:n, top:rs[0]};       // 同数（バナナは同じ数字のコピー）
  if (!bans.length && sameS && distinct && span === n - 1) return {t:"run", s:real[0].s, n:n, top:rs[rs.length-1]};
  return null;
}

/* 場のいちばん上に重ねられるか。同じ形・同じ枚数で「同じスートで上げる」か「同じ数字（色は問わない）」。
   組（連番・同数）は色を問わず上げられる。1枚で色を問わず上げられるのはゴリラだけ */
/* 数字が上か。いちばん大きい数字（4人なら13）の上には1を出せる（1周）。
   1枚は同じスートの1（ゴリラはどの色の1でも）。同数は色を問わず。
   連番は、いちばん大きい数字で終わる連番の上に、1から始まる連番（1・2／1・2・3）を色を問わず出せる */
function above(a, b){ return a > b || (b === G.ranks && a === 1); }
function canStack(role, top, f){
  if (!f) return false;
  if (f.t === "sb") return role === GOR;
  if (!top) return true;
  if (f.t !== top.t || f.n !== top.n) return false;
  if (f.t === "set") return above(f.top, top.top) || f.top === top.top;   // 同数は同じ数字でも重ねられる
  if (f.t === "run") return f.top > top.top || f.top === top.top || (top.top === G.ranks && f.top === f.n);   // 連番は色を問わない（1周：…12・13 の上に 1・2）
  if (f.top === top.top) return true;                       // 同じ数字（札は2枚ずつあるので同じ色でもよい）
  if (f.s === top.s) return above(f.top, top.top);
  if (above(f.top, top.top) && role === GOR) return true;   // ゴリラだけは色を問わない（1周にも効く）
  return false;
}
function topPlay(){ return G.played.length ? G.played[G.played.length-1] : null; }
function formFor(cs, hint){ return formOf(cs, hint); }
function legalPlay(p, cs, hint){
  var f = formFor(cs, hint);
  if (!f) return false;
  if (f.t === "sb" && roleNow(p) !== GOR) return false;
  var t = topPlay();
  return canStack(roleNow(p), t ? t.f : null, f);
}

/* 手札から作れる組をすべて */
function combosOf(h, maxN){
  var out = [];
  var nums = h.filter(isNum), ban = h.filter(isBan)[0], sb = h.filter(isSB)[0];
  nums.forEach(function(c){ out.push({cs:[c]}); });
  if (sb) out.push({cs:[sb]});
  function add(cs, hint){ var f = formOf(cs, hint); if (f && f.n === cs.length) out.push({cs:cs, hint:hint}); }
  for (var i=0;i<nums.length;i++){
    if (maxN >= 2){
      for (var j=i+1;j<nums.length;j++){
        add([nums[i], nums[j]]);
        if (maxN >= 3){
          for (var k=j+1;k<nums.length;k++) add([nums[i], nums[j], nums[k]]);
          if (ban) add([nums[i], nums[j], ban]);
        }
      }
      if (ban) add([nums[i], ban]);
    }
  }
  return out;
}

/* ══ 進行 ════════════════════════════════════════════ */
function newGame(){
  var N = +$("nSel").value, diff = $("diffSel").value;
  var ps = shuffle(PERSONAS.slice()).slice(0, N-1);
  var cards = [], id = 0;
  for (var s=0;s<4;s++) for (var r=1;r<=RANGE[N];r++) for (var k=0;k<COPIES;k++) cards.push({s:s, r:r, id:id++});
  for (var b=0;b<BANANAS;b++) cards.push({s:BAN, r:0, id:id++});
  cards.push({s:SBK, r:0, id:id++});
  G = { N:N, diff:diff, ranks:RANGE[N], off:Math.floor(rnd() * NR), names:["あなた"], tags:[""], per:[null],
        pile:shuffle(cards), hands:[], piles:[], round:0, trick:0,
        played:[], passed:[], order:[], cur:-1, last:-1, pred:-1, phase:"idle", pex:null, result:null,
        log:[], over:false, fresh:{}, sel:[], sbKnow:[], stats:{steal:0, sbWin:0} };
  for (var i=0;i<N-1;i++){ G.names.push(ps[i].name); G.tags.push(ps[i].tag); G.per.push(ps[i]); }
  for (var p=0;p<N;p++){ G.hands.push([]); G.piles.push([]); G.sbKnow.push(-1); }
  refill(false);
  logMsg("新しいゲーム（" + N + "人・各スート1〜" + G.ranks + "を2枚ずつ＋バナナ4＋シルバーバック）。相手は " + G.names.slice(1).join("・") + "。", "hot");
  startRound();
}

/* 手札が8枚になるまで補充。足りなければ出す順に1枚ずつ配れるだけ */
function refill(mark){
  var order = G.order.length ? G.order.slice() : G.hands.map(function(_, i){ return i; });
  var short = false;
  for (var round=0; round<HAND_MAX; round++){
    order.forEach(function(p){
      if (G.hands[p].length < HAND_MAX){
        if (!G.pile.length){ short = true; return; }
        var c = G.pile.pop(); G.hands[p].push(c);
        if (mark && p === 0) G.fresh[c.id] = true;
      }
    });
  }
  G.hands.forEach(sortHand);
  if (short) logMsg("山札が足りず、8枚まで補充できなかった（あなたの手札" + G.hands[0].length + "枚）。", "hot");
}

function startRound(){
  G.trick = 0;
  logMsg("── 第" + (G.round+1) + "局。", "hot");
  startTrick();
}

function startTrick(){
  G.played = []; G.pred = -1; G.result = null; G.sel = []; G.pex = null; G.last = -1;
  G.passed = []; for (var q=0;q<G.N;q++) G.passed.push(!G.hands[q].length);
  // 出す順は役割で決まる：王→商人→預言者→ゴリラ。空席の役割は飛ばす
  G.order = [];
  for (var k=0;k<G.N;k++) G.order.push(k);
  G.order.sort(function(a,b){ return PLAY_ORDER.indexOf(roleNow(a)) - PLAY_ORDER.indexOf(roleNow(b)); });
  startProphecy();
}

/* ── 預言：1人を指名し、伏せて1枚ずつやりとり（シルバーバックを持っていれば必ずそれを渡す） ── */
function startProphecy(){
  var pr = holder(PRO);
  if (pr < 0 || !G.hands[pr].length){ startPlay(); return; }
  if (pr === 0){ G.phase = "prophecy"; render(); return; }
  prophesy(pr, cpuPredict(pr));
}
function prophesy(pr, q){
  G.pred = q;
  if (q === pr || !G.hands[q].length){
    logMsg("預言者 " + nm(pr) + "：「この場は" + (q === pr ? "自分" : nm(q)) + "が取る」", pr === 0 ? "you" : "");
    startPlay(); return;
  }
  G.pex = {pr:pr, q:q, got:null, back:null};
  if (q === 0){ G.phase = "pgive"; render(); return; }
  prophetGive(cpuPickForProphet(q));
}
function prophetGive(card){
  var x = G.pex;
  removeCard(G.hands[x.q], card.id); G.hands[x.pr].push(card); sortHand(G.hands[x.pr]);
  x.got = card;
  if (x.pr === 0) G.fresh[card.id] = true;
  if (isSB(card)){ G.sbKnow[x.q] = x.pr; G.sbKnow[x.pr] = x.pr; G.stats.steal++; }
  if (x.pr === 0){ G.phase = "preturn"; render(); return; }
  prophetReturn(cpuPickReturn(x.pr));
}
function prophetReturn(card){
  var x = G.pex;
  removeCard(G.hands[x.pr], card.id); G.hands[x.q].push(card); sortHand(G.hands[x.q]);
  x.back = card;
  if (x.q === 0) G.fresh[card.id] = true;
  if (x.pr === 0) delete G.fresh[card.id];
  if (isSB(card)){ G.sbKnow[x.q] = x.q; G.sbKnow[x.pr] = x.q; }
  var head = "預言者 " + nm(x.pr) + "：「この場は " + nm(x.q) + " が取る」。";
  if (x.pr === 0) logMsg(head + nm(x.q) + " から" + cardName(x.got) + "を受け取り、" + cardName(card) + "を渡した。" + (isSB(x.got) ? "シルバーバックを奪った！" : ""), "you");
  else if (x.q === 0) logMsg(head + cardName(x.got) + "を渡し、" + cardName(card) + "を受け取った。" + (isSB(x.got) ? "シルバーバックを奪われた。" : ""), "you");
  else logMsg(head + "伏せて札を1枚ずつやりとりした。");
  startPlay();
}

/* ── 場：リードから始めて、パスした人を抜きながら出す順にぐるぐる回る ── */
function startPlay(){
  G.phase = "play";
  // リード：出す順でいちばん先の、出せる札のある人（ふつうは王）
  for (var k=0;k<G.order.length;k++){
    var p = G.order[k];
    if (!G.passed[p] && combosOf(G.hands[p], MAX_COMBO).some(function(o){ return legalPlay(p, o.cs, o.hint); })){ G.cur = p; nextTurn(); return; }
    G.passed[p] = true;
  }
  // だれも出せない（手札がバナナだけなど）
  G.cur = -1; endTrick();
}
function nextIn(p){
  var i = G.order.indexOf(p);
  for (var k=1;k<=G.order.length;k++){
    var q = G.order[(i + k) % G.order.length];
    if (!G.passed[q]) return q;
  }
  return -1;
}
function nextTurn(){
  var p = G.cur;
  if (p < 0){ endTrick(); return; }
  if (G.last >= 0 && p === G.last){ endTrick(); return; }       // 最後に出した人以外が全員抜けた
  if (!G.hands[p].length){ G.passed[p] = true; G.cur = nextIn(p); nextTurn(); return; }
  G.sel = [];
  render();
  if (p !== 0) later(function(){ var c = cpuAct(p); if (c) playCards(p, c.cs, c.hint); else pass(p); }, DIFF[G.diff].delay);
}
function playCards(p, cs, hint){
  cs.forEach(function(c){ removeCard(G.hands[p], c.id); });
  var f = formFor(cs, hint);
  var lead = !G.played.length;
  G.played.push({p:p, cards:cs, f:f, role:roleNow(p)});
  G.last = p;
  if (f.t === "sb"){
    G.sbKnow = G.sbKnow.map(function(){ return -1; });
    G.stats.sbWin++;
    logMsg(nm(p) + " がシルバーバックを出した。この場はゴリラのもの、群れのゴリラが集まってくる！", "bad");
    G.cur = -1; later(endTrick, DIFF[G.diff].delay); render(); return;
  }
  if (lead) logMsg(nm(p) + "（" + ROLES[roleNow(p)].name + "）が " + cardsName(cs) + " をリード" + (cs.length > 1 ? "（" + FORM_NAME[f.t] + cs.length + "枚）" : "") + "。", p === 0 ? "you" : "");
  G.cur = nextIn(p);
  nextTurn();
}
function pass(p){
  G.passed[p] = true;
  G.cur = nextIn(p);
  nextTurn();
}

function endTrick(){
  var cards = flat(G.played);
  var wp = G.last;
  var dest = {}, notes = [];
  if (wp < 0){ G.result = {w:-1, pts:0, dest:dest, notes:["だれも出せなかった"]}; G.phase = "trickEnd"; render(); return; }
  var left = cards.slice();
  function take(p, c){ G.piles[p].push(c); dest[c.id] = p; left.splice(left.indexOf(c), 1); }
  // ① 商人の仲買：場を取れなかったら、先に貨幣のいちばん大きい1枚
  var mer = holder(MER);
  if (mer >= 0 && mer !== wp){
    var coins = left.filter(function(c){ return c.s === 0; });
    if (coins.length){ var cm = maxBy(coins, ptsOf); take(mer, cm); notes.push("商人 " + nm(mer) + " が仲買で" + cardName(cm)); }
  }
  // ② 預言：指名した人が取ったら、先に場の聖典のいちばん大きい1枚
  var pr = holder(PRO);
  if (pr >= 0 && pr !== wp && G.pred === wp){
    var scr = left.filter(function(c){ return c.s === 1; });
    if (scr.length){ var pc = maxBy(scr, ptsOf); take(pr, pc); notes.push("預言的中、" + nm(pr) + " が" + cardName(pc)); }
    else notes.push("預言は的中したが、場に聖典がない");
  }
  // ③ シルバーバックは得点札にせず、山札に戻して混ぜる（また誰かに配られる）
  var sbc = left.filter(isSB)[0];
  if (sbc){ left.splice(left.indexOf(sbc), 1); G.pile.splice(Math.floor(rnd() * (G.pile.length + 1)), 0, sbc); }
  // ④ 残りを総取り
  var pts = sumPts(left);
  left.slice().forEach(function(c){ take(wp, c); });
  // ⑤ 群れを率いる：ほかの全員が、得点札のゴリラのスートでいちばん大きい1枚を差し出す
  if (sbc){
    var got = 0, cnt = 0;
    for (var q=0;q<G.N;q++){
      if (q === wp) continue;
      var gs = G.piles[q].filter(function(c){ return c.s === GOR; });
      if (!gs.length) continue;
      var gc = maxBy(gs, ptsOf);
      G.piles[q].splice(G.piles[q].indexOf(gc), 1); G.piles[wp].push(gc); got += ptsOf(gc); cnt++;
    }
    pts += got;
    notes.push(cnt ? "群れを率いる：" + cnt + "人からゴリラ札・" + got + "点" : "群れを率いる：まだだれもゴリラ札を持っていない");
    notes.push("シルバーバックは山札へ戻った");
  }
  G.result = { w:wp, role:roleNow(wp), pts:pts, dest:dest, notes:notes, n:cards.length };
  logMsg(nm(wp) + "（" + ROLES[roleNow(wp)].name + "）が場を取った：" + cards.length + "枚・" + pts + "点" + (notes.length ? "／" + notes.join("／") : ""),
    wp === 0 ? "you" : (roleNow(wp) === GOR ? "bad" : ""));
  G.phase = "trickEnd";
  render();
}

function advance(){
  G.trick++;
  G.fresh = {};
  refill(true);
  var anyCards = G.hands.some(function(h){ return h.length; });
  if (!anyCards){ endGame(); return; }
  if (G.trick < TRICKS){ startTrick(); return; }
  var line = [];
  for (var p=0;p<G.N;p++) line.push(nm(p) + " " + scoreOf(p));
  logMsg("第" + (G.round+1) + "局おわり：" + line.join("・"), "hot");
  G.round++;
  if (G.round < ROUNDS){ startRound(); return; }
  endGame();
}

function endGame(){
  G.over = true; G.phase = "over"; render();
  var rows = [];
  for (var p=0;p<G.N;p++) rows.push({p:p, s:scoreOf(p)});
  rows.sort(function(a,b){ return b.s - a.s; });
  var top = rows[0].s, winners = rows.filter(function(x){ return x.s === top; });
  var youWin = winners.some(function(x){ return x.p === 0; });
  var cls = youWin ? (winners.length > 1 ? "draw" : "win") : "lose";
  var word = youWin ? (winners.length > 1 ? "引き分け" : "あなたの勝ち") : nm(winners[0].p) + "の勝ち";
  var html = '<img class="banner" src="../assets/result.jpg" alt="">' + '<h2>' + (G.round >= ROUNDS ? '4局おわり' : '札が尽きて終わり') + '</h2><div class="result ' + cls + '">' + esc(word) + '</div>' +
    '<table><tr><th>順位</th><th>名前</th><th>取った札</th><th>合計</th></tr>';
  rows.forEach(function(x, i){
    html += '<tr><td>' + (i+1) + '</td><td>' + esc(nm(x.p)) + '</td><td class="n">' + G.piles[x.p].length + '枚</td><td class="n"><b>' + x.s + '</b></td></tr>';
  });
  html += '</table><p class="sub">得点札の点の合計（数字札は数字、バナナ0点）。</p>' +
    '<div class="sheetfoot"><button class="bigbtn" id="againBtn">もう一度</button><button class="bigbtn ghost" id="closeBtn">盤面を見る</button></div>';
  $("sheet").innerHTML = html; $("modal").hidden = false;
  $("againBtn").addEventListener("click", function(){ $("modal").hidden = true; newGame(); });
  $("closeBtn").addEventListener("click", closeModal);
}

/* ══ CPU ══════════════════════════════════════════════ */
function per(p){ return G.per[p] || PERSONAS[3]; }
function laterRoles(p){ var s = {}; for (var u=G.trick+1; u<TRICKS; u++) s[roleOf(p,u,G.round)] = true; return s; }
/* 札を手元に残す価値。この局のゴリラの番のための強い札とシルバーバック */
function holdVal(p, c){
  var lt = laterRoles(p), lastRound = G.round >= ROUNDS - 1;
  if (isSB(c)) return lt[GOR] ? 40 : (lastRound ? -5 : 8);
  if (isBan(c)) return 3;
  return c.r * 0.3 + (lt[GOR] ? c.r * 0.5 : 0);
}
function holdSum(p, cs){ var v = 0; cs.forEach(function(c){ v += holdVal(p, c); }); return v; }
function noise(p){ return (rnd() - 0.5) * DIFF[G.diff].noise * (0.6 + per(p).bluff * 2); }

function cpuAct(p){ return G.played.length ? cpuRespond(p) : cpuLead(p); }

/* 組でリードしてよいのは、数字が大きい組（上から4つの数字。黙って取りにいく）か、
   同じ形・同じ枚数で、その上に重ねられる組がもう1つ手元にあるとき（低い組で誘って重ね返す）。
   1・1・1 を出して取れても3点ほどにしかならないので、それ以外は1枚でリードする */
function hasBackup(p, o, f){
  var ids = {}; o.cs.forEach(function(c){ ids[c.id] = true; });
  var rest = G.hands[p].filter(function(c){ return !ids[c.id]; });
  return combosOf(rest, o.cs.length).some(function(b){
    if (b.cs.length !== o.cs.length || isSB(b.cs[0])) return false;
    var fb = formOf(b.cs, f.t === "run" ? "run" : "set");
    return fb && fb.t === f.t && canStack(roleNow(p), f, fb);
  });
}
function cpuLead(p){
  var P = per(p), r = roleNow(p), h = G.hands[p];
  var best = null, bestS = -1e9, any = null;
  combosOf(h, MAX_COMBO).forEach(function(o){
    if (!legalPlay(p, o.cs, o.hint)) return;
    var f = formOf(o.cs, o.hint), s;
    if (!any) any = o;
    if (o.cs.length > 1 && f.top < G.ranks - 3 && !hasBackup(p, o, f)) return;
    if (f.t === "sb") s = 0;                              // シルバーバックでリードしても取れるのは1枚だけ
    else s = o.cs.length * 2 + f.top * 0.3 - holdSum(p, o.cs) * (0.3 + 0.4 * P.tight);
    if (o.cs.length > 1 && f.top >= G.ranks - 3) s += sumPts(o.cs) * 0.5;   // 強い組は黙って通りやすい（期待値がいちばん高い）
    s += noise(p);
    if (s > bestS){ bestS = s; best = o; }
  });
  return best || any;
}

function cpuRespond(p){
  var P = per(p), r = roleNow(p), h = G.hands[p], n = G.played[0].cards.length;
  var pot = sumPts(flat(G.played));
  var sb = h.filter(isSB)[0];
  var raid = 0;
  if (sb) for (var q=0;q<G.N;q++) if (q !== p){ var gq = G.piles[q].filter(function(c){ return c.s === GOR; }); if (gq.length) raid += ptsOf(maxBy(gq, ptsOf)); }
  if (sb && r === GOR && pot + raid >= 14 - P.aggr * 6) return {cs:[sb]};
  var opts = [];
  combosOf(h, n).forEach(function(o){
    if (o.cs.length !== n || isSB(o.cs[0])) return;
    if (legalPlay(p, o.cs, o.hint)) opts.push(o);
  });
  if (!opts.length) return sb && r === GOR && pot > 0 ? {cs:[sb]} : null;
  // いちばん安く重ねられる出し方
  var best = opts.reduce(function(a, b){
    var fa = formFor(a.cs, a.hint), fb = formFor(b.cs, b.hint);
    return (fa.top + holdSum(p, a.cs) * 0.5) <= (fb.top + holdSum(p, b.cs) * 0.5) ? a : b;
  });
  var cost = holdSum(p, best.cs);
  var want = pot * (r === GOR ? 1.2 : 1) * (0.7 + P.aggr * 0.6) + sumPts(best.cs) * 0.5;
  // むずかしい：場が小さいうちは強い札を温存する
  if (DIFF[G.diff].careful && pot < 6 && formFor(best.cs, best.hint).top >= G.ranks - 2) want *= 0.5;
  if (want + noise(p) > cost * (0.8 + P.tight * 0.8) || rnd() < 0.15 * P.aggr) return best;
  return null;
}

/* 預言で渡す札：シルバーバックがあれば必ずそれ。なければいちばん要らない札 */
function cpuPickForProphet(q){
  var h = G.hands[q], sb = h.filter(isSB)[0];
  if (sb) return sb;
  return h.reduce(function(a,b){ return (ptsOf(a) + holdVal(q,a)) <= (ptsOf(b) + holdVal(q,b)) ? a : b; });
}
/* 預言者が返す札：受け取った札以外（何もしなかったことにはできない） */
function cpuPickReturn(pr){
  var got = G.pex && G.pex.got;
  var h = G.hands[pr].filter(function(c){ return !isSB(c) && c !== got; });
  if (!h.length) h = G.hands[pr].filter(function(c){ return c !== got; });
  if (!h.length) h = G.hands[pr];
  return h.reduce(function(a,b){ return (ptsOf(a) + holdVal(pr,a)) <= (ptsOf(b) + holdVal(pr,b)) ? a : b; });
}
/* 預言の指名：シルバーバックの持ち主を知っていれば奪いに行く。それ以外は取りそうな人（ゴリラが多い） */
function cpuPredict(pr){
  var h = G.hands[pr];
  var known = G.sbKnow[pr];
  if (known >= 0 && known !== pr && !h.some(isSB) && G.hands[known].length) return known;
  var gor = holder(GOR);
  if (gor >= 0 && gor !== pr && rnd() < 0.5 + per(pr).aggr * 0.3) return gor;
  var others = G.order.filter(function(q){ return q !== pr && G.hands[q].length; });
  return others.length ? others[Math.floor(rnd() * others.length)] : pr;
}

function render(){

function renderSched(){

  html += '<th>手</th><th>得点</th></tr>';

    html += '<tr class="' + (p===0?'mine':'') + '"><td><span class="nm">' + esc(nm(p)) + '</span>' + (G.tags[p] ? '<span class="tag">' + esc(G.tags[p]) + '</span>' : '') + '</td>';

function renderTrick(){
  var html = '', res = G.result;
  var lastBy = {}; G.played.forEach(function(x){ lastBy[x.p] = x; });
  var t = topPlay();
  for (var k=0;k<G.order.length;k++){
    var p = G.order[k], x = lastBy[p];
    var marks = '';
    if (G.played.length && G.played[0].p === p) marks += '<span class="mk lead">' + (roleNow(p) === KIN ? '先導' : 'リード') + '</span>';
    if (G.pred === p) marks += '<span class="mk pred">預言</span>';

    var body;
    if (x){
      var multi = x.cards.length > 1, isTop = t && t === x, win = res && res.w === p;
      body = '<div class="stack">' + x.cards.map(function(c){ return cardHTML(c, (multi ? 'sm' : '') + (win ? ' win' : isTop ? ' fresh' : ''), '', ''); }).join('') + '</div>';
      if (G.passed[p] && !res) marks += '<span class="mk lead">パス</span>';
    } else if (G.passed[p] && G.phase !== "prophecy" && G.phase !== "pgive" && G.phase !== "preturn"){
      body = '<div class="passed">パス</div>';
    } else body = '<div class="empty"></div>';

}

function stackHint(){
  var t = topPlay(); if (!t) return '';
  var f = t.f, r = roleNow(0);
  if (f.t === "set") return '同数' + f.n + '枚で、' + f.top + '以上の数字（色は問わない）' + (f.top === G.ranks ? '。1の同数も出せる（1周）' : '');
  if (f.t === "run"){
    var wrap = f.top === G.ranks ? '。1から始まる連番も出せる（1周）' : '';
    return '連番' + f.n + '枚：いちばん大きい数字が' + f.top + '以上なら色を問わない' + wrap;
  }
  var what = '1枚';
  var s;
  if (f.top === G.ranks){                                  // いちばん上の数字には1で1周できる
    s = SUITS[f.s] + 'の1（1周）か、どの色でも' + f.top;
    if (r === GOR) s = 'どの色でも' + f.top + 'か1（1周）';
  } else {
    s = SUITS[f.s] + 'の' + (f.top + 1) + '以上か、どの色でも' + f.top;
    if (r === GOR) s = f.top + '以上なら色を問わず';
  }
  return what + '：' + s;
}

function statusText(){
  if (G.over) return 'ゲームおわり';
  if (G.phase === "trickEnd" && G.result){
    var r = G.result;
    if (r.w < 0) return 'だれも出せなかった';
    return '<em>' + esc(nm(r.w)) + '</em>（' + ROLES[r.role].name + '）が場を取った：' + r.n + '枚・' + r.pts + '点' + (r.notes.length ? '　' + esc(r.notes.join('／')) : '');
  }
  if (G.phase === "prophecy") return 'あなたは預言者。指名する人を選ぶ';
  if (G.phase === "pgive") return '預言者 <em>' + esc(nm(G.pex.pr)) + '</em> に指名された';
  if (G.phase === "preturn") return '<em>' + esc(nm(G.pex.q)) + '</em> から札を受け取った。返す札を選ぶ';
  var t = topPlay();
  if (!t) return (holder(KIN) >= 0 ? '王 <em>' + esc(nm(holder(KIN))) + '</em> の先導を待っている' : 'リードを待っている');
  return 'いちばん上は <em>' + esc(cardsName(t.cards)) + '</em>（' + esc(nm(t.p)) + '）。重ねられるのは ' + stackHint();
}

function myTurn(){ return G.phase === "play" && G.cur === 0; }
function selCards(){ return G.hands[0].filter(function(c){ return G.sel.indexOf(c.id) >= 0; }); }

function renderHand(){
  var h = G.hands[0], phase = G.phase, pickable = {};
  if (myTurn()) h.forEach(function(c){ pickable[c.id] = 1; });
  if (phase === "preturn") h.forEach(function(c){ if (c !== G.pex.got || h.length === 1) pickable[c.id] = 1; });
  if (phase === "pgive"){ var sb = h.filter(isSB)[0]; (sb ? [sb] : h).forEach(function(c){ pickable[c.id] = 1; }); }
  var busy = myTurn() || phase === "pgive" || phase === "preturn";
  var t = topPlay();
  var html = '';
  h.forEach(function(c){
    var can = !!pickable[c.id];
    var extra = can ? 'pick' : (busy ? 'idle' : '');
    if (G.fresh[c.id]) extra += ' fresh';
    if (G.sel.indexOf(c.id) >= 0) extra += ' sel';
    var inner = '';
    if (isSB(c) && roleNow(0) === GOR && !G.over) inner = '<span class="badge">必勝</span>';
    else if (myTurn() && DIFF[G.diff].hint && t && t.cards.length === 1 && legalPlay(0, [c])) inner = '<span class="badge">可</span>';
    html += cardHTML(c, extra, can ? 'tabindex="0" role="button" data-id="' + c.id + '"' : '', inner);
  });
  $("hand").innerHTML = html || '<span class="hintline">手札なし</span>';
}

function renderActions(){
  var a = '', hint = '';
  if (G.over){
    a = '<button class="bigbtn" id="againBtn2">もう一度</button>';
  } else if (G.phase === "prophecy"){
    for (var k=0;k<G.order.length;k++){
      var q = G.order[k];
      a += '<button class="bigbtn ghost" data-pred="' + q + '">' + roleBadge(roleNow(q)) + esc(nm(q)) + '</button>';
    }
    hint = '指名した人と<em>伏せて1枚ずつ</em>やりとりし、相手がシルバーバックを持っていれば必ずあなたに来ます。指名した人が場を取れば、先に場の聖典のいちばん大きい1枚をもらえます。自分を指名するとやりとりなし。次の場であなたはゴリラなので、奪ったシルバーバックはすぐ使えます。';
  } else if (G.phase === "pgive" || G.phase === "preturn"){
    // 渡す札・返す札は、選んだあとにボタンで確かめてから渡す（うっかり必要な札を渡さないように）
    var pick = selCards()[0], giving = G.phase === "pgive";
    var to = giving ? G.pex.pr : G.pex.q;
    if (pick){
      a = '<button class="bigbtn" id="giveBtn">' + esc(cardName(pick)) + ' を' + esc(nm(to)) + 'に' + (giving ? '渡す' : '返す') + '</button>' +
          '<button class="bigbtn ghost" id="clearBtn">選び直す</button>';
    }
    if (giving) hint = '預言者 <em>' + esc(nm(G.pex.pr)) + '</em> に指名されました。渡す札を選んでください。' + (G.hands[0].some(isSB) ? '<span class="warn">シルバーバックを持っているので、それを渡す決まりです。</span>' : '1枚返ってきます。');
    else hint = '<em>' + esc(nm(G.pex.q)) + '</em> から <em>' + cardName(G.pex.got) + '</em> を受け取りました' + (isSB(G.pex.got) ? '（シルバーバックを奪った！）' : '') + '。返す札を1枚選んでください（受け取った札はそのまま返せません）。';
    if (pick) hint += ' <span class="warn">' + esc(cardName(pick)) + ' を' + (giving ? '渡します' : '返します') + '。よければボタンを押してください。</span>';
  } else if (myTurn()){
    var cs = selCards(), lead = !G.played.length;
    var ok = cs.length && legalPlay(0, cs);
    var ff = cs.length ? formFor(cs) : null;
    a = '<button class="bigbtn" data-play=""' + (ok ? '' : ' disabled') + '>' + (ok && ff ? '出す（' + FORM_NAME[ff.t] + (ff.n > 1 ? ff.n + '枚' : '') + '）' : '出す') + '</button>';
    if (!lead) a += '<button class="bigbtn ghost" id="passBtn">パス（この場から抜ける）</button>';
    if (cs.length) a += '<button class="bigbtn ghost" id="clearBtn">選び直す</button>';
    hint = lead ? (roleNow(0) === KIN ? '王の先導です。' : 'あなたのリードです。') + '1枚か、<em>連番</em>（同じスートの続き数字2〜3枚）か、<em>同数</em>（同じ数字2〜3枚）を出します。バナナは同数の足りない1枚の代わり（連番には使えない）。'
                : '重ねられるのは ' + stackHint() + '。出さないならパス（この場ではもう出せない）。';
    if (lead && roleNow(0) === KIN && DIFF[G.diff].hint) hint += ' <em>弱い札1枚で先導すると、みんなが重ねて場が育ちやすい。いらない札を処分する好機でもあります。</em>';
    if (cs.length && !ok) hint += ' <span class="warn">その札は重ねられません。</span>';
  } else if (G.phase === "trickEnd"){
    var last = G.trick + 1 >= TRICKS;
    a = '<button class="bigbtn" id="nextBtn">' + (last ? (G.round + 1 >= ROUNDS ? '結果を見る' : '次の局へ') : '次の場へ') + '</button>';
  }
  $("actions").innerHTML = a;
  $("hint").innerHTML = hint;
  var nb = $("nextBtn"); if (nb){ nb.addEventListener("click", advance); nb.focus({preventScroll:true}); }
  var ab = $("againBtn2"); if (ab) ab.addEventListener("click", newGame);
  var cb = $("clearBtn"); if (cb) cb.addEventListener("click", function(){ G.sel = []; render(); });
  var gb = $("giveBtn"); if (gb) gb.addEventListener("click", function(){
    var c = selCards()[0]; if (!c) return;
    G.sel = [];
    if (G.phase === "pgive") prophetGive(c); else if (G.phase === "preturn") prophetReturn(c);
  });
  var pb = $("passBtn"); if (pb) pb.addEventListener("click", function(){ if (myTurn()){ G.fresh = {}; pass(0); } });
  Array.prototype.forEach.call(document.querySelectorAll("[data-play]"), function(b){
    b.addEventListener("click", function(){ submitSel(b.getAttribute("data-play") || undefined); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-pred]"), function(b){
    b.addEventListener("click", function(){ prophesy(0, +b.getAttribute("data-pred")); });
  });
}

function submitSel(hint){
  var cs = selCards();
  if (!myTurn() || !legalPlay(0, cs, hint)) return;
  G.fresh = {}; G.sel = [];
  playCards(0, cs, hint);
}

function onHandPick(id){
  var c = null; G.hands[0].forEach(function(x){ if (x.id === id) c = x; });
  if (!c) return;
  if (G.phase === "pgive"){
    if (G.hands[0].some(isSB) && !isSB(c)) return;
    G.sel = G.sel[0] === id ? [] : [id]; render(); return;   // 選ぶだけ。渡すのは確認のボタンで
  }
  if (G.phase === "preturn"){
    if (c === G.pex.got && G.hands[0].length > 1) return;
    G.sel = G.sel[0] === id ? [] : [id]; render(); return;
  }
  if (!myTurn()) return;
  var lim = G.played.length ? G.played[0].cards.length : MAX_COMBO;
  if (isSB(c)){ G.sel = [id]; render(); return; }
  var i = G.sel.indexOf(id);
  if (i >= 0) G.sel.splice(i, 1);
  else {
    G.sel = G.sel.filter(function(x){ return !G.hands[0].some(function(y){ return y.id === x && isSB(y); }); });
    if (G.sel.length < lim) G.sel.push(id);
  }
  render();
}
$("hand").addEventListener("click", function(e){
  var el = e.target.closest("[data-id]"); if (el) onHandPick(+el.getAttribute("data-id"));
});
$("hand").addEventListener("dblclick", function(e){
  // 1枚で出すときは、ダブルクリックでもすぐ出せる
  var el = e.target.closest("[data-id]");
  if (el && myTurn()){ G.sel = [+el.getAttribute("data-id")]; submitSel(); }
});
$("hand").addEventListener("keydown", function(e){
  if (e.key !== "Enter" && e.key !== " ") return;
  var el = e.target.closest("[data-id]"); if (el){ e.preventDefault(); onHandPick(+el.getAttribute("data-id")); }
});

    '<li>以降は順にぐるぐる回り、いちばん上の札に<b>重ねる</b>か<b>パス</b>。重ねられるのは同じ形・同じ枚数で、<b>同じスートで数字が上</b>か、<b>同じ数字</b>（色は問わない。札は2枚ずつあるので同じ色でもよい）。<b>組（連番・同数）は色を問わず、数字が上なら重ねられる</b>（同じ数字でもよい）。<b>1枚を色を問わず上げられるのはゴリラだけ</b>。<b>いちばん大きい数字（4人なら13）の上には1を出せる</b>（1周。1枚は同じスートの1。ゴリラはどの色の1でもよい。同数は色を問わず。連番は13で終わる連番の上に1から始まる連番（12・13の上に1・2））</li>' +
    '<li><b>パスしたらその場から抜ける</b>。最後に出した人以外が全員抜けたら、<b>最後に出した人が場の札を総取り</b></li></ul>' +
    '<h3>役割の能力</h3><ul>' +
    '<li><b>王（先導）</b>：場の最初にリードする<br><span class="sub">王はゲームを規律する。厳しい掟（強い組の先導）は民衆を怯えさせ、寛容な掟（弱い1枚の先導）は莫大な富を産むこともあるが、それは誰かの権力を利することにも繋がりかねない。</span></li>' +
    '<li><b>預言者（預言）</b>：リードの前に1人を指名し、伏せて1枚ずつやりとり（相手がシルバーバックを持っていれば必ずそれが来る。受け取った札をそのまま返すことはできない）。指名した人が場を取ったら、先に場の<b>聖典のいちばん大きい1枚</b>をもらう<br><span class="sub">預言者は「真のリーダー」を預言する。人の上に立つ者に群れの長の証シルバーバックは許されず、取り上げられる。預言どおりその者が場を制すれば、寄進として聖典が奉納される。</span></li>' +
    '<li><b>商人（仲買）</b>：場を取れなかったら、先に場の<b>貨幣のいちばん大きい1枚</b>をもらう<br><span class="sub">商人は誰がリーダーかには興味がない。考えるのは私腹を肥やすことだけ。誰が勝とうと、手数料として貨幣を1枚せしめる。</span></li>' +
    '<li><b>ゴリラ（野生）</b>：数字が上なら色を問わず重ねられる。<b>シルバーバック</b>を出せば、その場は即座にゴリラのもの。さらに<b>ほかの全員が、得点札のゴリラのスートでいちばん大きい1枚</b>を差し出す（群れを率いる）。使ったシルバーバックは<b>山札に戻して混ぜる</b>ので、また誰かに配られ、預言者に狙われる。ゴリラ以外は出せず、パスした後も出せない<br><span class="sub">ゴリラには秩序が分からぬ。強いものこそが頂点であり、その象徴シルバーバックは、飼い慣らされたゴリラたちに野生の本能を呼び覚ます（群れを率いる）。</span></li></ul>' +
    '<h3>点と手札</h3>' +
    '<p>数字札は数字どおり、バナナ0点（シルバーバックは点にならない）。<b>得点札はゲームに戻りません。</b>場が終わるたびに手札を8枚まで補充します（山札が尽きたら配れるだけ）。</p>' +
    '<div class="sheetfoot"><button class="bigbtn" id="closeBtn">盤面に戻る</button></div>';
  $("modal").hidden = false;
  $("closeBtn").addEventListener("click", closeModal);
}

$("rulesBtn").addEventListener("click", showRules);
$("resetBtn").addEventListener("click", function(){ clearTimeout(timer); $("modal").hidden = true; newGame(); });
$("nSel").addEventListener("change", function(){ clearTimeout(timer); $("modal").hidden = true; newGame(); });
$("diffSel").addEventListener("change", function(){ if (G) { G.diff = this.value; logMsg("CPUのむずかしさを変えた。"); render(); } });
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("modal").hidden) closeModal(); });

/* テスト用：?debug を付けたときだけ、中の状態を外から読めるようにする */
if (/[?&]debug\b/.test(location.search)) window.__mplg = function(){ return G; };

newGame();
})();
</script>
