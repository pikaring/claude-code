<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="canonical" href="https://pikaring.github.io/merchant-prophet-leader-gorilla/app/">
<title>商人・預言者・指導者・ゴリラ</title>
<link rel="icon" href="../assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#16151B; --bg2:#111015; --panel:#1F1D26; --panel2:#2A2733;
    --line:#3A3645; --line2:#4E495B;
    --fg:#E7E2D6; --muted:#9A95A4;
    --bone:#ECE5D4; --ink:#16120D;
    --s0:#B8912A; --s1:#3F72A6; --s2:#B5503A; --s3:#7A55A8;
    --accent:#B99BE3; --gor:#6B6F74; --alarm:#D9534F; --ok:#6FA96B;
    --disp:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",serif;
    --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:dark;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    background-image:radial-gradient(120% 70% at 50% -10%, #2a2436 0%, rgba(22,21,27,0) 60%)}
  .wrap{max-width:1000px; margin:0 auto; padding-inline:16px; padding-block:10px 16px;
    display:flex; flex-direction:column; gap:8px}

  /* ── 細い操作帯 ── */
  .bar{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .bar .spacer{flex:1 1 auto}
  .chip{font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--muted);
    background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:3px 8px;
    display:flex; gap:5px; align-items:center}
  .chip b{color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums}
  select,.btn{font-family:var(--body); font-size:12px; color:var(--fg); background:var(--panel2);
    border:1px solid var(--line2); border-radius:3px; padding:4px 9px; cursor:pointer}
  select{padding:3px 4px; background:transparent; border:none; color:var(--accent); font-weight:500}
  .btn:hover{background:var(--line)}
  .btn:focus-visible, select:focus-visible, .card:focus-visible, .bigbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .home{color:var(--muted); font-size:12px; text-decoration:none; border-bottom:1px solid var(--line2); padding-bottom:1px}
  .home:hover{color:var(--accent); border-color:var(--accent)}

  /* ── 役割表（得点表を兼ねる） ── */
  .sched{width:100%; border-collapse:separate; border-spacing:0 3px; font-size:12px}
  .sched th{font-family:var(--mono); font-size:10px; font-weight:400; color:var(--muted); letter-spacing:.08em; padding:0 2px 1px}
  .sched th.now{color:var(--accent); font-weight:600}
  .sched td{background:var(--panel); padding:3px 4px; text-align:center; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .sched td:first-child{text-align:left; border-left:1px solid var(--line); border-radius:3px 0 0 3px; white-space:nowrap}
  .sched td:last-child{border-right:1px solid var(--line); border-radius:0 3px 3px 0}
  .sched tr.mine td{background:#262232}
  .sched .nm{font-family:var(--disp); letter-spacing:.06em; color:var(--bone)}
  .sched .tag{font-size:9.5px; color:var(--muted); margin-left:4px}
  .sched .pts{font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums; min-width:34px}
  .sched .hc{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
  .sched td.cur{box-shadow:inset 0 0 0 1px var(--accent); background:#2F2940}
  .sched td.past{opacity:.35}
  .role{display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:19px; border-radius:3px;
    font-size:11px; font-weight:700; color:#fff; padding:0 3px; line-height:1}
  .role.r0{background:var(--s0)} .role.r1{background:var(--s1)} .role.r2{background:var(--s2)} .role.r3{background:var(--s3)}
  .role.r4{background:var(--gor)} .role svg{width:15px;height:15px;fill:#E9E2D2}
  .role.big{height:22px; font-size:12px; padding:0 6px; gap:4px}

  /* ── 場：このトリックの札 ── */
  .table{background:var(--bg2); border:1px solid var(--line); border-radius:4px; padding:9px 10px;
    display:flex; flex-direction:column; gap:7px}
  .trick{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
  .slot{display:flex; flex-direction:column; align-items:center; gap:3px; width:70px}
  .slot .lbl{font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70px;
    display:flex; gap:3px; align-items:center}
  .slot .lbl b{color:var(--fg); font-weight:500}
  .slot .marks{height:15px; font-size:10px; display:flex; gap:2px; align-items:center; font-family:var(--body)}
  .mk{border-radius:2px; padding:0 3px; line-height:14px; white-space:nowrap; font-size:9.5px}
  .mk.pred{background:var(--s1); color:#fff}
  .mk.lead{border:1px solid var(--line2); color:var(--muted)}
  .mk.turn{background:var(--accent); color:var(--ink)}
  .empty{width:52px;height:74px;border-radius:4px;border:1px dashed var(--line2)}
  .status{font-size:12.5px; color:var(--fg); text-align:center; min-height:19px}
  .status em{font-style:normal; color:var(--accent); font-weight:500}
  .status .warn{color:var(--alarm)}

  /* ── 札 ── */
  .card{position:relative; width:52px; height:74px; flex:none; border-radius:4px; border:none;
    background:var(--bone); color:var(--ink); padding:0; cursor:default; font-family:var(--body);
    display:flex; flex-direction:column; overflow:hidden; text-align:left;
    box-shadow:0 2px 0 rgba(0,0,0,.45), 0 5px 12px rgba(0,0,0,.3)}
  .card .band{height:6px; flex:none}
  .card .num{font-family:var(--disp); font-size:25px; line-height:1; padding:5px 0 0 6px; letter-spacing:-.03em}
  .card .suit{position:absolute; right:4px; bottom:5px; width:22px; height:22px}
  .card .sn{position:absolute; left:6px; bottom:5px; font-size:8.5px; font-weight:700; letter-spacing:.04em}
  .card.c0 .band{background:var(--s0)} .card.c0 .num,.card.c0 .sn{color:#7A5E12} .card.c0 .suit{fill:var(--s0)}
  .card.c1 .band{background:var(--s1)} .card.c1 .num,.card.c1 .sn{color:#264F7A} .card.c1 .suit{fill:var(--s1)}
  .card.c2 .band{background:var(--s2)} .card.c2 .num,.card.c2 .sn{color:#8A3421} .card.c2 .suit{fill:var(--s2)}
  .card.c3 .band{background:var(--s3)} .card.c3 .num,.card.c3 .sn{color:#553982} .card.c3 .suit{fill:var(--s3)}
  .card.pick{cursor:pointer; transition:transform .12s ease, box-shadow .12s ease}
  .card.pick:hover,.card.pick:focus-visible{transform:translateY(-7px); box-shadow:0 8px 0 rgba(0,0,0,.4),0 14px 24px rgba(0,0,0,.45)}
  .card.idle{filter:brightness(.55) saturate(.6)}
  .card.fresh{box-shadow:0 0 0 2px var(--accent), 0 5px 12px rgba(0,0,0,.4)}
  .card.win{box-shadow:0 0 0 3px var(--ok), 0 5px 12px rgba(0,0,0,.4)}
  .card.gone{opacity:.35}
  .card .badge{position:absolute; top:8px; right:3px; font-size:8.5px; font-weight:700; background:var(--ok); color:#0E1410;
    border-radius:2px; padding:0 3px}
  .card .to{position:absolute; left:0; right:0; bottom:0; font-size:8.5px; text-align:center; font-weight:700;
    background:rgba(22,18,13,.82); color:var(--bone); padding:1px 0}
  .card.sm{width:34px;height:48px}
  .card.sm .num{font-size:16px; padding:3px 0 0 4px}
  .card.sm .band{height:4px}
  .card.sm .suit{width:13px;height:13px;right:2px;bottom:3px}
  .card.sm .sn{display:none}

  /* ── 自分 ── */
  .me{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted)}
  .me .who{font-family:var(--disp); font-size:15px; letter-spacing:.08em; color:var(--bone)}
  .me .say{color:var(--fg)}
  .hand{display:flex; gap:5px; flex-wrap:wrap; min-height:74px; align-items:flex-end}
  .ctl{display:flex; gap:7px; flex-wrap:wrap; align-items:center; min-height:30px}
  .ctl:empty{display:none}
  .bigbtn{font-family:var(--body); font-size:13px; font-weight:700; letter-spacing:.04em;
    background:var(--accent); color:var(--ink); border:none; border-radius:3px; padding:7px 14px; cursor:pointer;
    display:inline-flex; gap:6px; align-items:center}
  .bigbtn:hover{filter:brightness(1.08)}
  .bigbtn.ghost{background:transparent; color:var(--fg); border:1px solid var(--line2); font-weight:500}
  .bigbtn.ghost:hover{background:var(--panel2); filter:none}
  .hintline{font-size:11.5px; color:var(--muted); line-height:1.5}
  .hintline em{color:var(--accent); font-style:normal; font-weight:500}

  .log{border-top:1px solid var(--line); padding-top:6px;
    font-family:var(--mono); font-size:11px; line-height:1.7; color:var(--muted);
    max-height:78px; overflow-y:auto}
  .log div{display:flex; gap:8px}
  .log .t{color:var(--line2); flex:none}
  .log .hot{color:var(--accent)} .log .bad{color:var(--alarm)} .log .you{color:#CFE3D2}

  /* ── モーダル ── */
  .modal{position:fixed; inset:0; z-index:60; background:rgba(12,11,15,.9); display:grid; place-items:center; padding:20px; overflow-y:auto}
  .sheet{background:var(--panel); border:1px solid var(--line2); border-radius:5px; max-width:600px; width:100%;
    padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .sheet h2{font-family:var(--disp); font-size:21px; margin:0 0 4px; color:var(--bone); letter-spacing:.06em}
  .sheet h3{font-family:var(--disp); font-size:15px; margin:18px 0 6px; color:var(--accent); letter-spacing:.08em}
  .sheet p,.sheet li{font-size:13.5px; margin:6px 0; line-height:1.65}
  .sheet ul{padding-left:1.2em; margin:6px 0}
  .sheet .sub{color:var(--muted); font-size:12.5px; margin-top:0}
  .sheet table{border-collapse:collapse; width:100%; font-size:12.5px; margin:8px 0}
  .sheet td,.sheet th{border-bottom:1px solid var(--line); padding:5px 6px; text-align:left}
  .sheet th{color:var(--muted); font-weight:400; font-size:11.5px}
  .sheet td.n{font-family:var(--mono); text-align:right; font-variant-numeric:tabular-nums}
  .result{font-family:var(--disp); font-size:29px; letter-spacing:.08em; margin:6px 0 2px}
  .result.win{color:var(--ok)} .result.lose{color:var(--alarm)} .result.draw{color:var(--muted)}
  .sheetfoot{display:flex; gap:9px; margin-top:18px; flex-wrap:wrap}

  @media (max-width:560px){
    .wrap{gap:7px}
    .card{width:40px;height:58px}
    .card .num{font-size:19px;padding:4px 0 0 4px}
    .card .suit{width:15px;height:15px;right:2px;bottom:3px}
    .card .sn{display:none}
    .card .band{height:5px}
    .card .badge{top:6px; font-size:7.5px}
    .hand{gap:3px; min-height:58px}
    .slot{width:58px}
    .slot .lbl{max-width:58px}
    .empty{width:40px;height:58px}
    .trick{gap:4px}
    .sched{font-size:11px}
    .sched .tag{display:none}
    .role{min-width:19px; height:17px; font-size:10px}
    .log{max-height:60px}
    .table{padding:7px 6px}
    .me .say{font-size:11.5px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ape" viewBox="0 0 100 100">
    <circle cx="16" cy="45" r="11.5"/><circle cx="84" cy="45" r="11.5"/>
    <ellipse cx="50" cy="48" rx="31" ry="35"/>
    <rect x="25" y="37" width="50" height="7" rx="3.5" fill="#17130E" opacity=".5"/>
    <circle cx="38.5" cy="33.5" r="3.6" fill="#17130E"/><circle cx="61.5" cy="33.5" r="3.6" fill="#17130E"/>
    <ellipse cx="50" cy="65" rx="19.5" ry="15" fill="#17130E" opacity=".28"/>
    <ellipse cx="43.5" cy="62" rx="3.2" ry="2.4" fill="#17130E"/><ellipse cx="56.5" cy="62" rx="3.2" ry="2.4" fill="#17130E"/>
    <path d="M40 72 Q50 78.5 60 72" fill="none" stroke="#17130E" stroke-width="2.6" stroke-linecap="round"/>
  </symbol>
  <!-- 貨幣：穴あき銭 -->
  <symbol id="su0" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 1 1 0 20a10 10 0 1 1 0-20zm-3 7h6v6h-6z"/></symbol>
  <!-- 聖典：巻物 -->
  <symbol id="su1" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v11a2 2 0 0 0 2 2H8a3 3 0 0 1-3-3zM3 6a2 2 0 0 1 4 0v2H3z M8 8h8v1.6H8z M8 11.5h8v1.6H8z M8 15h5v1.6H8z" fill-rule="evenodd"/></symbol>
  <!-- 旗 -->
  <symbol id="su2" viewBox="0 0 24 24"><path d="M5 2h2v20H5z M7 3h12l-3 4.5l3 4.5H7z"/></symbol>
  <!-- 冠 -->
  <symbol id="su3" viewBox="0 0 24 24"><path d="M2 7l5 5l5-8l5 8l5-5l-2 12H4z M4 20h16v2H4z"/></symbol>
</svg>

<div class="wrap">
  <div class="bar">
    <span class="chip">第<b id="roundNum">1</b>/5局 T<b id="trickNum">1</b>/<b id="trickMax">5</b> 山札<b id="pileCount">0</b></span>
    <span class="chip"><select id="nSel" aria-label="人数">
      <option value="2">2人</option><option value="3">3人</option><option value="4">4人</option><option value="5" selected>5人</option>
    </select><select id="diffSel" aria-label="CPUのむずかしさ">
      <option value="easy">やさしい</option><option value="normal" selected>ふつう</option><option value="hard">むずかしい</option>
    </select></span>
    <span class="spacer"></span>
    <a class="home" href="../index.html">紹介ページ</a>
    <button class="btn" id="rulesBtn">あそびかた</button>
    <button class="btn" id="resetBtn">最初から</button>
  </div>

  <table class="sched" id="sched" aria-label="役割の予定と得点"></table>

  <div class="table">
    <div class="trick" id="trick"></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>

  <div class="me" id="meRow"></div>
  <div class="hand" id="hand"></div>
  <div class="ctl" id="actions"></div>
  <div class="hintline" id="hint"></div>
  <div class="log" id="log" aria-live="polite"></div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(function(){
"use strict";

/* ══ 定数 ══════════════════════════════════════════════ */
var ROLES = [
  {name:"商人",   short:"商", ab:"仲買"},
  {name:"預言者", short:"預", ab:"預言"},
  {name:"指導者", short:"指", ab:"徴税"},
  {name:"王",     short:"王", ab:"献上と下賜"},
  {name:"ゴリラ", short:"ゴ", ab:"—"}
];
var GOR = 4, MER = 0, PRO = 1, LEA = 2, KIN = 3;
var SUITS = ["貨幣","聖典","旗","冠"];
var RANGE = {2:12, 3:17, 4:22, 5:26};   // 人数ごとの数字の範囲
var HAND_MAX = 8, TRICKS = 5, ROUNDS = 5;
/* 対戦相手は all-in-texas の PERSONAS と同じ5人 */
var PERSONAS = [
  { name:'ビエホ',     tag:'堅実',     tight:0.9,  aggr:0.35, bluff:0.05 },
  { name:'ディアブロ', tag:'攻撃',     tight:0.5,  aggr:0.9,  bluff:0.3  },
  { name:'ゴルド',     tag:'ゆるい',   tight:0.15, aggr:0.3,  bluff:0.1  },
  { name:'ヴィニー',   tag:'標準',     tight:0.6,  aggr:0.55, bluff:0.15 },
  { name:'ロコ',       tag:'気まぐれ', tight:0.4,  aggr:0.6,  bluff:0.25 }
];
var DIFF = {
  easy:   {noise:5.0, memory:false, hint:true,  delay:650},
  normal: {noise:2.0, memory:false, hint:false, delay:600},
  hard:   {noise:0.6, memory:true,  hint:false, delay:600}
};

var G = null;
function $(id){ return document.getElementById(id); }
function rnd(){ return Math.random(); }
function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* プレイヤー p のトリック t（第k局）での役割。役割は1トリックごとに時計回りに隣へ移る */
function roleOf(p, t, k){ return ((p - t + k) % 5 + 5) % 5; }
function roleNow(p){ return roleOf(p, G.trick, G.round); }
function holder(role){ for (var p=0;p<G.N;p++) if (roleNow(p) === role) return p; return -1; }
function nm(p){ return p === 0 ? "あなた" : G.names[p]; }
function sortHand(h){ h.sort(function(a,b){ return a.s - b.s || a.r - b.r; }); }
function sum(cards){ var v=0; for (var i=0;i<cards.length;i++) v+=cards[i].r; return v; }
function scoreOf(p){ return sum(G.piles[p]); }
function removeCard(arr, id){ for (var i=0;i<arr.length;i++) if (arr[i].id===id) return arr.splice(i,1)[0]; return null; }
function cardName(c){ return SUITS[c.s] + c.r; }

/* ══ 進行 ════════════════════════════════════════════ */
function newGame(){
  var N = +$("nSel").value, diff = $("diffSel").value;
  var ps = shuffle(PERSONAS.slice()).slice(0, N-1);
  var cards = [], id = 0;
  for (var s=0;s<4;s++) for (var r=1;r<=RANGE[N];r++) cards.push({s:s, r:r, id:id++});
  G = { N:N, diff:diff, ranks:RANGE[N], names:["あなた"], tags:[""], per:[null],
        pile:shuffle(cards), discard:[], hands:[], piles:[], round:0, trick:0, TR:TRICKS,
        lead:0, played:[], order:[], turn:0, pred:-1, phase:"idle", ex:null, result:null,
        voids:[], log:[], over:false, fresh:{} };
  for (var i=0;i<N-1;i++){ G.names.push(ps[i].name); G.tags.push(ps[i].tag); G.per.push(ps[i]); }
  for (var p=0;p<N;p++){ G.hands.push([]); G.piles.push([]); }
  logMsg("新しいゲーム（" + N + "人・数字1〜" + G.ranks + "）。相手は " + G.names.slice(1).join("・") + "。", "hot");
  startRound();
}

function startRound(){
  // 捨て札を山札に戻す。手に残った札は持ち越し。8枚になるまで補充（足りなければ等分）
  G.pile = shuffle(G.pile.concat(G.discard)); G.discard = [];
  var need = HAND_MAX - G.hands[0].length;
  var d = Math.min(need, Math.floor(G.pile.length / G.N));
  for (var p=0;p<G.N;p++){ for (var i=0;i<d;i++) G.hands[p].push(G.pile.pop()); sortHand(G.hands[p]); }
  G.TR = Math.min(TRICKS, G.hands[0].length);
  G.trick = 0; G.lead = G.round % G.N;
  G.voids = []; for (var q=0;q<G.N;q++) G.voids.push([false,false,false,false]);
  logMsg("── 第" + (G.round+1) + "局。親は" + nm(G.lead) + "。" + (G.round ? "持ち越し" + (HAND_MAX-need) + "枚＋補充" + d + "枚。" : "8枚ずつ配った。") +
    (G.TR < TRICKS ? "札が足りないので、この局は" + G.TR + "トリック。" : ""), "hot");
  startTrick();
}

function startTrick(){
  G.played = []; G.pred = -1; G.result = null; G.fresh = {};
  G.order = []; for (var k=0;k<G.N;k++) G.order.push((G.lead + k) % G.N);
  G.turn = 0;
  var king = holder(KIN), gor = holder(GOR);
  var givers = [];
  if (king >= 0) for (var k2=0;k2<G.N;k2++){ var p = G.order[k2]; if (p !== king && p !== gor) givers.push(p); }
  if (king >= 0 && givers.length){
    G.ex = { king:king, givers:givers, got:{}, idx:0 };
    // CPU の献上
    givers.forEach(function(p){ if (p !== 0) giveToKing(p, cpuPickGift(p)); });
    if (givers.indexOf(0) >= 0){ G.phase = "give"; render(); return; }
    afterGifts();
  } else { G.ex = null; startProphecy(); }
}

function giveToKing(p, card){
  removeCard(G.hands[p], card.id);
  G.hands[G.ex.king].push(card);
  G.ex.got[p] = card;
  if (G.ex.king === 0) G.fresh[card.id] = true;
  // 手札が動いたので、そのスートの「持っていない」推定は消す
  G.voids[G.ex.king][card.s] = false;
}

function afterGifts(){
  var ex = G.ex;
  sortHand(G.hands[ex.king]);
  if (ex.king === 0){ ex.idx = 0; G.phase = "grant"; render(); return; }
  ex.givers.forEach(function(p){ grantFromKing(p, cpuPickGrant(ex.king, p)); });
  finishExchange();
}

function grantFromKing(p, card){
  removeCard(G.hands[G.ex.king], card.id);
  G.hands[p].push(card); sortHand(G.hands[p]);
  G.voids[p][card.s] = false;
  if (p === 0) G.fresh[card.id] = true;
  if (G.ex.king === 0) delete G.fresh[card.id];
  G.ex.back = G.ex.back || {}; G.ex.back[p] = card;
}

function finishExchange(){
  var ex = G.ex;
  if (ex.king === 0){
    logMsg("王のあなたは " + ex.givers.map(nm).join("・") + " から献上を受け、1枚ずつ下賜した。", "you");
  } else if (ex.givers.indexOf(0) >= 0){
    logMsg("王 " + nm(ex.king) + " に" + cardName(ex.got[0]) + "を献上し、" + cardName(ex.back[0]) + "を下賜された。", "you");
    if (ex.givers.length > 1) logMsg("王 " + nm(ex.king) + " はほかに " + ex.givers.filter(function(p){return p!==0;}).map(nm).join("・") + " とも札をやりとりした。");
  } else {
    logMsg("王 " + nm(ex.king) + " が " + ex.givers.map(nm).join("・") + " と札をやりとりした。");
  }
  startProphecy();
}

function startProphecy(){
  var pr = holder(PRO);
  if (pr < 0){ startPlay(); return; }
  if (pr === 0){ G.phase = "prophecy"; render(); return; }
  G.pred = cpuPredict(pr);
  logMsg("預言者 " + nm(pr) + "：「このトリックは " + nm(G.pred) + " が取る」");
  startPlay();
}

function startPlay(){ G.phase = "play"; nextTurn(); }

function nextTurn(){
  if (G.turn >= G.N){ resolveTrick(); return; }
  var p = G.order[G.turn];
  render();
  if (p !== 0) later(function(){ playCard(p, cpuPickCard(p)); }, DIFF[G.diff].delay);
}

function legal(p){
  var h = G.hands[p];
  if (!G.played.length) return h.slice();
  var led = G.played[0].c.s;
  var f = h.filter(function(c){ return c.s === led; });
  return f.length ? f : h.slice();
}

function playCard(p, card){
  if (G.played.length && card.s !== G.played[0].c.s) G.voids[p][G.played[0].c.s] = true;
  removeCard(G.hands[p], card.id);
  G.played.push({p:p, c:card});
  G.turn++;
  nextTurn();
}

function currentWinner(){
  if (!G.played.length) return null;
  var led = G.played[0].c.s, best = null;
  G.played.forEach(function(x){ if (x.c.s === led && (!best || x.c.r > best.c.r)) best = x; });
  return best;
}

function resolveTrick(){
  var w = currentWinner(), wp = w.p, wr = roleNow(wp);
  var cards = G.played.map(function(x){ return x.c; });
  var dest = {};  // 札id → 行き先の説明
  var got = wr === GOR ? cards.slice() : cards.filter(function(c){ return c.s === wr; });
  var left = cards.filter(function(c){ return got.indexOf(c) < 0; });
  got.forEach(function(c){ dest[c.id] = wp; });
  var notes = [];
  // 指導者の徴税：残りから好きな1枚（アプリではいちばん大きい札）
  if (wr === LEA && left.length){
    var tx = maxCard(left); left.splice(left.indexOf(tx),1); got.push(tx); dest[tx.id] = wp;
    notes.push("徴税で" + cardName(tx));
  }
  G.piles[wp] = G.piles[wp].concat(got);
  // 商人の仲買：取れなかったとき、残った貨幣の最小1枚
  var mer = holder(MER);
  if (mer >= 0 && mer !== wp){
    var coins = left.filter(function(c){ return c.s === 0; });
    if (coins.length){
      var cm = coins.reduce(function(a,b){ return a.r <= b.r ? a : b; });
      left.splice(left.indexOf(cm),1); G.piles[mer].push(cm); dest[cm.id] = mer;
      notes.push("商人 " + nm(mer) + " が仲買で" + cardName(cm));
    }
  }
  // 預言者の預言：当たれば残りから好きな1枚（アプリではいちばん大きい札）
  var pr = holder(PRO);
  if (pr >= 0 && G.pred === wp){
    if (left.length){
      var pc = maxCard(left); left.splice(left.indexOf(pc),1); G.piles[pr].push(pc); dest[pc.id] = pr;
      notes.push("預言的中、" + nm(pr) + " が" + cardName(pc));
    } else notes.push("預言は的中したが、残りの札がない");
  }
  left.forEach(function(c){ G.discard.push(c); dest[c.id] = -1; });
  var pts = sum(got);
  G.result = { w:wp, role:wr, pts:pts, dest:dest, notes:notes };
  var head = nm(wp) + "（" + ROLES[wr].name + "）が取った";
  logMsg(head + "。" + (wr === GOR ? "ゴリラが全部持っていく：" : "") + pts + "点" + (notes.length ? "／" + notes.join("／") : ""),
    wp === 0 ? "you" : (wr === GOR ? "bad" : ""));
  G.lead = wp;
  G.phase = "trickEnd";
  render();
}
function maxCard(a){ return a.reduce(function(x,y){ return x.r >= y.r ? x : y; }); }

function advance(){
  G.trick++;
  if (G.trick < G.TR){ startTrick(); return; }
  // 局の終わり
  var line = [];
  for (var p=0;p<G.N;p++) line.push(nm(p) + " " + scoreOf(p));
  logMsg("第" + (G.round+1) + "局おわり：" + line.join("・"), "hot");
  G.round++;
  if (G.round < ROUNDS && G.hands[0].length + Math.floor((G.pile.length + G.discard.length) / G.N) > 0){ startRound(); return; }
  endGame();
}

function endGame(){
  G.over = true; G.phase = "over"; render();
  var rows = [];
  for (var p=0;p<G.N;p++) rows.push({p:p, s:scoreOf(p)});
  rows.sort(function(a,b){ return b.s - a.s; });
  var top = rows[0].s, winners = rows.filter(function(x){ return x.s === top; });
  var youWin = winners.some(function(x){ return x.p === 0; });
  var cls = youWin ? (winners.length > 1 ? "draw" : "win") : "lose";
  var word = youWin ? (winners.length > 1 ? "引き分け" : "あなたの勝ち") : nm(winners[0].p) + "の勝ち";
  var html = '<h2>5局おわり</h2><div class="result ' + cls + '">' + esc(word) + '</div>' +
    '<table><tr><th>順位</th><th>名前</th>' + SUITS.map(function(s){return '<th>'+s+'</th>';}).join('') + '<th>合計</th></tr>';
  rows.forEach(function(x, i){
    var by = [0,0,0,0]; G.piles[x.p].forEach(function(c){ by[c.s] += c.r; });
    html += '<tr><td>' + (i+1) + '</td><td>' + esc(nm(x.p)) + '</td>' + by.map(function(v){return '<td class="n">'+v+'</td>';}).join('') +
      '<td class="n"><b>' + x.s + '</b></td></tr>';
  });
  html += '</table><p class="sub">得点札の数字の合計。スート別の内訳は、どの役割で稼いだかではなく、得点札のスートです。</p>' +
    '<div class="sheetfoot"><button class="bigbtn" id="againBtn">もう一度</button><button class="bigbtn ghost" id="closeBtn">盤面を見る</button></div>';
  $("sheet").innerHTML = html; $("modal").hidden = false;
  $("againBtn").addEventListener("click", function(){ $("modal").hidden = true; newGame(); });
  $("closeBtn").addEventListener("click", closeModal);
}

/* ══ CPU ══════════════════════════════════════════════ */
function per(p){ return G.per[p] || PERSONAS[3]; }
function laterRoles(p){ var s = {}; for (var u=G.trick+1; u<G.TR; u++) s[roleOf(p,u,G.round)] = true; return s; }
/* 札を手元に残す価値。先の役割で自分のスートになる札、ゴリラの番のための強い札、次の局への持ち越し */
function holdVal(p, c){
  var lt = laterRoles(p), v = 0;
  if (lt[c.s]) v += c.r;
  if (lt[GOR]) v += c.r * 0.5;
  if (G.round < ROUNDS-1) v += c.r * 0.12;
  return v;
}
function trickVal(role, cards){
  if (role === GOR) return sum(cards);
  var v = 0; cards.forEach(function(c){ if (c.s === role) v += c.r; }); return v + (role === LEA && cards.length ? 0 : 0);
}
function noise(p){ return (rnd() - 0.5) * DIFF[G.diff].noise * (0.6 + per(p).bluff * 2); }

/* このあと出す人に、もっと強い札で抜かれそうな度合い（0〜1） */
function beatRisk(p, card){
  var after = G.order.slice(G.turn + 1);
  if (!after.length) return 0;
  var s = card.s;
  var live = after.filter(function(q){ return !G.voids[q][s]; });
  if (!live.length) return 0;
  if (!DIFF[G.diff].memory) return Math.min(0.6, 0.18 * live.length * (1 - card.r / G.ranks) * 2);
  // むずかしい：見えていない、より強い札の枚数から見積もる
  var seen = {};
  G.hands[p].forEach(function(c){ seen[c.id] = 1; });
  G.played.forEach(function(x){ seen[x.c.id] = 1; });
  G.piles.forEach(function(pl){ pl.forEach(function(c){ seen[c.id] = 1; }); });
  var higher = 0;
  for (var r = card.r + 1; r <= G.ranks; r++){ var id = s * G.ranks + (r - 1); if (!seen[id]) higher++; }
  if (!higher) return 0;
  var unknown = G.pile.length + G.discard.length;
  G.order.forEach(function(q){ if (q !== p && G.played.every(function(x){ return x.p !== q; })) unknown += G.hands[q].length; });
  var inHands = live.reduce(function(a,q){ return a + G.hands[q].length; }, 0);
  var frac = unknown ? Math.min(1, inHands / unknown) : 0;
  return 1 - Math.pow(1 - frac, higher);
}

function cpuPickCard(p){
  var P = per(p), r = roleNow(p), h = legal(p);
  var wDeny = 0.3 + 0.6 * P.aggr, wHold = 0.15 + 0.5 * P.tight;
  var best = null, bestS = -1e9;
  h.forEach(function(c){
    var s;
    if (!G.played.length){
      if (r === GOR) s = c.r;
      else if (c.s === r) s = c.r * 1.2;
      else s = -c.r * 0.35 + (rnd() < P.bluff ? 3 : 0);
      s -= wHold * holdVal(p, c) * (c.s === r ? 0.3 : 1);
    } else {
      var led = G.played[0].c.s, w = currentWinner(), wr = roleNow(w.p);
      var trickCards = G.played.map(function(x){ return x.c; });
      var wins = c.s === led && c.r > w.c.r;
      if (wins){
        var gain = trickVal(r, trickCards.concat([c]));
        if (r === LEA) gain += 6;              // 徴税の1枚ぶんの見込み
        var deny = wr !== r ? trickVal(wr, trickCards) : 0;
        var risk = beatRisk(p, c);
        s = (gain + wDeny * deny) * (1 - risk) - wHold * holdVal(p, c) * (c.s === r ? 0.3 : 1);
      } else {
        var feed = (wr === GOR || c.s === wr) ? c.r : 0;
        var mer = holder(MER);
        if (c.s === 0 && mer >= 0 && mer !== p && mer !== w.p) feed += c.r * 0.3;
        s = -0.8 * feed - wHold * holdVal(p, c);
      }
    }
    s += noise(p);
    if (s > bestS){ bestS = s; best = c; }
  });
  return best;
}

function cpuPickGift(p){
  var h = G.hands[p];
  return h.reduce(function(a,b){ return (a.r + holdVal(p,a) + noise(p)*0.3) <= (b.r + holdVal(p,b)) ? a : b; });
}
/* 王の下賜：いちばん要らない札を返す。むずかしいでは、ゴリラより後に出す人へ強い札を回すこともある */
function cpuPickGrant(k, p){
  var h = G.hands[k];
  var gor = holder(GOR);
  if (G.diff === "hard" && gor >= 0 && G.order.indexOf(p) > G.order.indexOf(gor) && rnd() < per(k).aggr * 0.5){
    var strong = h.filter(function(c){ return c.s !== KIN && !laterRoles(k)[c.s]; });
    if (strong.length) return maxCard(strong);
  }
  return h.reduce(function(a,b){ return (a.r + holdVal(k,a) + (a.s===KIN?a.r:0)) <= (b.r + holdVal(k,b) + (b.s===KIN?b.r:0)) ? a : b; });
}
function cpuPredict(pr){
  var h = G.hands[pr], top = h.length ? maxCard(h).r : 0;
  if (top >= G.ranks - 3 && rnd() < 0.5 + per(pr).aggr * 0.5) return pr;
  var gor = holder(GOR);
  for (var k=0;k<G.N;k++){ var q = G.order[k]; if (q !== gor) return q; }
  return pr;
}

/* ══ 描画 ════════════════════════════════════════════ */
function roleBadge(role, big){
  if (role === GOR) return '<span class="role r4' + (big?' big':'') + '" title="ゴリラ"><svg><use href="#ape"/></svg>' + (big ? 'ゴリラ' : '') + '</span>';
  return '<span class="role r' + role + (big?' big':'') + '" title="' + ROLES[role].name + '">' + (big ? ROLES[role].name : ROLES[role].short) + '</span>';
}
function cardHTML(c, extra, attrs, inner){
  return '<div class="card c' + c.s + (extra ? ' ' + extra : '') + '" ' + (attrs || '') + ' aria-label="' + cardName(c) + '">' +
    '<span class="band"></span><span class="num">' + c.r + '</span><span class="sn">' + SUITS[c.s] + '</span>' +
    '<svg class="suit"><use href="#su' + c.s + '"/></svg>' + (inner || '') + '</div>';
}

function render(){
  if (!G) return;
  $("roundNum").textContent = Math.min(G.round + 1, ROUNDS);
  $("trickNum").textContent = Math.min(G.trick + 1, G.TR);
  $("trickMax").textContent = G.TR;
  $("pileCount").textContent = G.pile.length + G.discard.length;
  renderSched(); renderTrick(); renderMe(); renderHand(); renderActions(); renderLog();
}

function renderSched(){
  var html = '<tr><th></th>';
  for (var t=0;t<TRICKS;t++) html += '<th class="' + (t===G.trick && !G.over ? 'now' : '') + '">T' + (t+1) + '</th>';
  html += '<th>手</th><th>得点</th></tr>';
  for (var p=0;p<G.N;p++){
    html += '<tr class="' + (p===0?'mine':'') + '"><td><span class="nm">' + esc(nm(p)) + '</span>' + (G.tags[p] ? '<span class="tag">' + esc(G.tags[p]) + '</span>' : '') + '</td>';
    for (var t2=0;t2<TRICKS;t2++){
      var cls = t2 >= G.TR ? 'past' : (t2 === G.trick && !G.over ? 'cur' : (t2 < G.trick ? 'past' : ''));
      html += '<td class="' + cls + '">' + roleBadge(roleOf(p, t2, G.round)) + '</td>';
    }
    html += '<td class="hc">' + G.hands[p].length + '</td><td class="pts">' + scoreOf(p) + '</td></tr>';
  }
  $("sched").innerHTML = html;
}

function renderTrick(){
  var html = '', w = currentWinner(), res = G.result;
  var byP = {}; G.played.forEach(function(x){ byP[x.p] = x.c; });
  var turnP = (G.phase === "play" && G.turn < G.N) ? G.order[G.turn] : -1;
  for (var k=0;k<G.N;k++){
    var p = G.order.length ? G.order[k] : k, c = byP[p];
    var marks = '';
    if (k === 0 && G.order.length) marks += '<span class="mk lead">リード</span>';
    if (G.pred === p) marks += '<span class="mk pred">預言</span>';
    if (p === turnP) marks += '<span class="mk turn">手番</span>';
    var extra = '', inner = '';
    if (c){
      if (res){
        if (c.id === (currentWinner()||{}).c.id) extra = 'win';
        var d = res.dest[c.id];
        inner = '<span class="to">' + (d === -1 ? '捨て札' : '→' + esc(d === 0 ? 'あなた' : G.names[d])) + '</span>';
        if (d === -1) extra += ' gone';
      } else if (w && w.c.id === c.id) extra = 'win';
    }
    html += '<div class="slot"><div class="lbl">' + roleBadge(roleNow(p)) + '<b>' + esc(nm(p)) + '</b></div>' +
      (c ? cardHTML(c, extra, '', inner) : '<div class="empty"></div>') + '<div class="marks">' + marks + '</div></div>';
  }
  $("trick").innerHTML = html;
  $("status").innerHTML = statusText();
}

function statusText(){
  if (G.over) return '5局おわり';
  if (G.phase === "trickEnd" && G.result){
    var r = G.result;
    return '<em>' + esc(nm(r.w)) + '</em>（' + ROLES[r.role].name + '）が取った ' + r.pts + '点' + (r.notes.length ? '　' + esc(r.notes.join('／')) : '');
  }
  if (G.phase === "give") return '王 <em>' + esc(nm(G.ex.king)) + '</em> への献上';
  if (G.phase === "grant") return 'あなたは王。献上を受けた札に印が付いている';
  if (G.phase === "prophecy") return 'あなたは預言者。このトリックを取る人を指名する';
  var w = currentWinner();
  if (!w) return 'リードを待っている';
  var wr = roleNow(w.p);
  return 'リードは<em>' + SUITS[G.played[0].c.s] + '</em>。いま勝っているのは ' + esc(nm(w.p)) + '（' + ROLES[wr].name + '）' +
    (wr === GOR ? '　<span class="warn">このままだと全部ゴリラのもの</span>' : '');
}

function renderMe(){
  var r = roleNow(0);
  var say = {
    0:'商人：貨幣の札が点。取れなくても、残った貨幣の最小1枚は拾える（仲買）',
    1:'預言者：聖典の札が点。取る人を当てると、残りから1枚（預言）',
    2:'指導者：旗の札が点。取ったら、残りからもう1枚（徴税）',
    3:'王：冠の札が点。トリックの前に献上を受け、1枚ずつ下賜する',
    4:'ゴリラ：取ったトリックの札が全部、点になる'
  }[r];
  if (G.over) say = '';
  $("meRow").innerHTML = '<span class="who">あなた</span>' + (G.over ? '' : roleBadge(r, true)) + '<span class="say">' + esc(say) + '</span>';
}

function renderHand(){
  var h = G.hands[0], phase = G.phase, pickable = {};
  var myTurn = phase === "play" && G.order[G.turn] === 0;
  if (myTurn) legal(0).forEach(function(c){ pickable[c.id] = 1; });
  if (phase === "give" || phase === "grant") h.forEach(function(c){ pickable[c.id] = 1; });
  var w = currentWinner();
  var html = '';
  h.forEach(function(c){
    var can = !!pickable[c.id];
    var extra = can ? 'pick' : ((myTurn || phase==="give" || phase==="grant") ? 'idle' : '');
    if (G.fresh[c.id]) extra += ' fresh';
    var inner = '';
    if (myTurn && can && DIFF[G.diff].hint && w && c.s === w.c.s && c.r > w.c.r) inner = '<span class="badge">勝</span>';
    html += cardHTML(c, extra, can ? 'tabindex="0" role="button" data-id="' + c.id + '"' : '', inner);
  });
  $("hand").innerHTML = html || '<span class="hintline">手札なし</span>';
}

function renderActions(){
  var a = '', hint = '';
  if (G.over){
    a = '<button class="bigbtn" id="againBtn2">もう一度</button>';
  } else if (G.phase === "give"){
    hint = '王 <em>' + esc(nm(G.ex.king)) + '</em> に献上する札を1枚選んでください。あとで王から1枚返ってきます（何が返るかは王しだい）。';
  } else if (G.phase === "grant"){
    var p = G.ex.givers[G.ex.idx];
    hint = '<em>' + esc(nm(p)) + '</em>（' + ROLES[roleNow(p)].name + '）に返す札を選んでください。' +
      '献上された札（' + G.ex.givers.map(function(q){ return esc(nm(q)) + '→' + cardName(G.ex.got[q]); }).join('、') + '）でも、元の手札でもかまいません。';
  } else if (G.phase === "prophecy"){
    for (var k=0;k<G.N;k++){
      var q = G.order[k];
      a += '<button class="bigbtn ghost" data-pred="' + q + '">' + roleBadge(roleNow(q)) + esc(nm(q)) + '</button>';
    }
    hint = 'リードは ' + esc(nm(G.order[0])) + '。ゴリラが取ると札は残らないので、預言が当たっても得はありません。自分を指名してもかまいません。';
  } else if (G.phase === "play" && G.order[G.turn] === 0){
    hint = G.played.length ? '出す札を選んでください。リードされたスート（' + SUITS[G.played[0].c.s] + '）があれば、それを出す決まりです。' : 'あなたのリードです。好きな札を出してください。';
  } else if (G.phase === "trickEnd"){
    var last = G.trick + 1 >= G.TR;
    a = '<button class="bigbtn" id="nextBtn">' + (last ? (G.round + 1 >= ROUNDS ? '結果を見る' : '次の局へ') : '次のトリックへ') + '</button>';
  }
  $("actions").innerHTML = a;
  $("hint").innerHTML = hint;
  var nb = $("nextBtn"); if (nb){ nb.addEventListener("click", advance); nb.focus({preventScroll:true}); }
  var ab = $("againBtn2"); if (ab) ab.addEventListener("click", newGame);
  Array.prototype.forEach.call(document.querySelectorAll("[data-pred]"), function(b){
    b.addEventListener("click", function(){
      G.pred = +b.getAttribute("data-pred");
      logMsg("預言者のあなた：「このトリックは " + nm(G.pred) + " が取る」", "you");
      startPlay();
    });
  });
}

function onHandPick(id){
  var c = null; G.hands[0].forEach(function(x){ if (x.id === id) c = x; });
  if (!c) return;
  if (G.phase === "give"){ giveToKing(0, c); afterGifts(); return; }
  if (G.phase === "grant"){
    var p = G.ex.givers[G.ex.idx];
    grantFromKing(p, c);
    G.ex.idx++;
    if (G.ex.idx >= G.ex.givers.length){ finishExchange(); return; }
    render(); return;
  }
  if (G.phase === "play" && G.order[G.turn] === 0){
    if (!legal(0).some(function(x){ return x.id === id; })) return;
    G.fresh = {};
    playCard(0, c);
  }
}
$("hand").addEventListener("click", function(e){
  var el = e.target.closest("[data-id]"); if (el) onHandPick(+el.getAttribute("data-id"));
});
$("hand").addEventListener("keydown", function(e){
  if (e.key !== "Enter" && e.key !== " ") return;
  var el = e.target.closest("[data-id]"); if (el){ e.preventDefault(); onHandPick(+el.getAttribute("data-id")); }
});

/* ══ ログ・モーダル ═══════════════════════════════════ */
function logMsg(text, cls){
  if (!G) return;
  G.log.unshift({t:"R" + (G.round+1) + "-T" + (G.trick+1), text:text, cls:cls||""});
  if (G.log.length > 80) G.log.pop();
  renderLog();
}
function renderLog(){
  if (!G) return;
  $("log").innerHTML = G.log.map(function(l){ return '<div><span class="t">' + l.t + '</span><span class="' + l.cls + '">' + esc(l.text) + '</span></div>'; }).join('');
}
var timer = null;
function later(fn, ms){ clearTimeout(timer); timer = setTimeout(fn, ms); }
function closeModal(){ $("modal").hidden = true; }

    '<h3>トリック</h3><ul>' +

    '<li>預言者がいれば、<b>このトリックを取る人を指名</b>（自分でもよい）</li>' +

    '<li><b>商人の仲買</b>：商人が取れなかったとき、残った貨幣のうち最小の1枚を得点札に</li>' +

    '<p><b>得点札はゲームに戻りません。</b>手に残った札は次の局へ持ち越し、8枚になるまで山札から補充します。最終局で手に残った札は点になりません。</p>' +

$("rulesBtn").addEventListener("click", showRules);
$("resetBtn").addEventListener("click", function(){ clearTimeout(timer); $("modal").hidden = true; newGame(); });
$("nSel").addEventListener("change", function(){ clearTimeout(timer); $("modal").hidden = true; newGame(); });
$("diffSel").addEventListener("change", function(){ if (G) { G.diff = this.value; logMsg("CPUのむずかしさを変えた。"); render(); } });
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("modal").hidden) closeModal(); });

newGame();
})();
</script>
