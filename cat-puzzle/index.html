<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネコおち</title>
<meta name="description" content="ねこを すべらせて 4ひき そろえる、おちもの パズル">
<meta name="theme-color" content="#2f5d3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ネコおち">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== ヘッダー：スコアと メッセージ ===== -->
  <header class="header">
    <div class="status">
      <span class="status__label">スコア</span>
      <span class="status__value" id="score">0</span>
      <span class="status__level" id="best">さいこう 0</span>
      <span class="status__level" id="moves">てすう 0</span>
    </div>

    <p class="message" id="message" role="status" aria-live="polite">よこか たてに 4ひき そろえるニャ！</p>
  </header>

  <!-- ===== メインビュー：ねこの ばん ===== -->
  <main class="board-area" id="boardArea">
    <div class="board" id="board" role="grid" aria-label="ねこの ばん"></div>
  </main>

  <!-- ===== したの おおきな ボタン ===== -->
  <footer class="actions">
    <button type="button" class="btn btn--again" id="btnReset">
      <span class="btn__icon" aria-hidden="true">🔄</span>
      <span class="btn__text">はじめから</span>
    </button>
    <button type="button" class="btn btn--kind" id="btnKind">
      <span class="btn__icon" aria-hidden="true">🐾</span>
      <span class="btn__text">ねこの かず</span>
      <span class="btn__sub" id="kindSub">4しゅるい</span>
    </button>
  </footer>

  <!-- ===== ねこの かずを えらぶ がめん ===== -->
  <div class="modal" id="kindModal" hidden>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="kindTitle">

      <h2 class="modal__title" id="kindTitle">ねこは なんしゅるい？</h2>

      <div class="cat-choices" id="kindChoices"></div>

      <p class="modal__note">えらびなおすと さいしょから はじまります</p>

      <button type="button" class="btn btn--close" id="btnCloseKind">
        <span class="btn__text">とじる</span>
      </button>

    </div>
  </div>

  <!-- ===== 「2れんさ！」などの おおきな おしらせ ===== -->
  <div class="bignews" id="bignews" hidden aria-hidden="true">
    <p class="bignews__text" id="bignewsText"></p>
  </div>

<script src="game.js"></script>
</body>
</html>
